    owner_surface: execution_result
    severity: P2
    current_tests:
      - tests/check_engine/test_aggregate_execution.py::test_absolute_tolerance_is_context_independent
      - tests/check_engine/test_aggregate_execution.py::test_invalid_explicit_tolerance_agrees_with_compiler
      - tests/check_engine/test_aggregate_execution.py::test_aggregate_admission_returns_canonical_threshold
      - tests/check_engine/test_aggregate_execution.py::test_aggregate_unknown_private_metadata_blocks_even_with_override
      - tests/services/test_run_service_aggregate_admission.py::test_invalid_aggregate_tolerance_blocks_before_profile
      - tests/services/test_run_service_aggregate_admission.py::test_unresolved_named_aggregate_policy_blocks_before_profile
      - tests/services/test_run_service_aggregate_admission.py::test_invalid_named_policy_metadata_errors_before_profile
      - tests/services/test_run_service_aggregate_admission.py::test_valid_explicit_tolerance_overrides_named_policy_without_execution
      - tests/services/test_run_service_aggregate_admission.py::test_invalid_explicit_override_does_not_fall_back_to_named_policy
      - tests/services/test_run_service_aggregate_admission.py::test_malformed_named_metadata_is_not_hidden_by_valid_override
      - tests/services/test_run_service_aggregate_admission.py::test_injected_public_loader_does_not_imply_verified_policy_absence
      - tests/services/test_run_service_aggregate_admission.py::test_mixed_run_preserves_aggregate_policy_error_and_row_count
      - tests/artifacts/test_compiled_contract_loader.py::test_private_runtime_policy_metadata_preserves_public_loader_shape
      - tests/artifacts/test_compiled_contract_loader.py::test_private_runtime_metadata_is_discarded_on_identity_mismatch
    carryover_gates:
      - gate: check_engine_semantics_carryover
        status: pending
        expected_suite: numeric_policy
      - gate: parser_compiler_contract_carryover
        status: pending
        expected_suite: typed_check_plan_runtime_semantics
    requirement_refs:
      - docs/compatibility/public-contract-inventory.md: Aggregate metric execution
      - docs/planning/milestone-7-4-prework.md: Acceptance And Conformance Matrix
    notes: >
      The shared explicit absolute threshold is exact and context independent. Verified absent metadata defaults to zero; unresolved policy blocks without a valid override; malformed or unverified metadata cannot become a successful comparison. Private policy values do not reach diagnostics.
