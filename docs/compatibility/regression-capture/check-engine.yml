  - id: duplicate-key-excludes-null-containing-tuples
    title: Duplicate-key checks ignore null-containing grain-key tuples
    area: check-engine
    bug_class: key_semantics
    owner_surface: sql_rendering
    severity: P2
    current_tests:
      - tests/adapters/test_duckdb_sql_renderer.py::test_duplicate_key_excludes_null_containing_duplicate_candidates
    carryover_gates:
      - gate: check_engine_semantics_carryover
        status: pending
        expected_suite: grain_key_semantics
      - gate: adapter_testkit_regression_carryover
        status: pending
        expected_suite: sql_comparison_semantics
    requirement_refs:
      - docs/compatibility/public-contract-inventory.md: Grain-key safety execution
      - docs/compatibility/adapter-api.md: SQL comparison semantics for future adapter test kit
    notes: >
      Duplicate-key failure counts consider only fully non-null grain-key
      tuples; null-containing key tuples belong to null-key checks.
  - id: key-safety-prerequisites-block-dependent-checks
    title: Key-safety prerequisites block dependent checks when unsafe
    area: check-engine
    bug_class: prerequisite_blocking
    owner_surface: execution_result
    severity: P2
    current_tests:
      - tests/check_engine/test_engine.py::test_engine_blocks_dependent_check_when_key_safety_prerequisite_fails
      - tests/check_engine/test_engine.py::test_engine_blocks_check_when_prerequisite_is_not_executable
    carryover_gates:
      - gate: check_engine_semantics_carryover
        status: pending
        expected_suite: prerequisite_blocking
    requirement_refs:
      - docs/compatibility/public-contract-inventory.md: Check engine boundary and result model
      - docs/compatibility/public-contract-inventory.md: Grain-key safety execution
    notes: >
      Dependent row-level checks must remain blocked when key-safety
      prerequisites fail, error, are blocked, or are not executable so later
      execution phases cannot produce misleading comparison evidence.
