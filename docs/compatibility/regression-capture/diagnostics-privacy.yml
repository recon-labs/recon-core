schema_version: 1
area: diagnostics-privacy
captures:
  - id: yaml-diagnostic-redaction
    title: YAML diagnostics use safe summaries instead of raw parser text
    area: diagnostics-privacy
    bug_class: diagnostics
    owner_surface: redaction
    severity: P2
    current_tests:
      - tests/parser/test_yaml_loader.py::test_load_yaml_text_reports_invalid_yaml
      - tests/config/test_project_config.py::test_load_project_config_reports_invalid_yaml
      - tests/profiles/test_loader.py::test_load_selected_profile_sanitizes_invalid_yaml_diagnostics
    carryover_gates:
      - gate: diagnostics_privacy_carryover
        status: deferred
        expected_suite: diagnostic_sanitization
        rationale: Current in-memory and CLI privacy is proven; generated result and later diagnostic surfaces remain runner/results and evidence work.
    requirement_refs:
      - docs/implementation/errors-and-diagnostics.md: Low-level exception diagnostic sanitization
      - docs/compatibility/public-contract-inventory.md: Low-level exception diagnostic sanitization
    notes: >
      YAML parse failures can include authored snippets. Parser, project
      config, and profile YAML diagnostics must preserve safe summaries instead
      of exposing raw parser exception text.
  - id: yaml-profile-and-source-privacy
    title: YAML diagnostics protect profile secrets and source-target text
    area: diagnostics-privacy
    bug_class: profile_secrets
    owner_surface: source_target_privacy
    severity: P2
    current_tests:
      - tests/parser/test_yaml_loader.py::test_load_yaml_text_reports_invalid_yaml
      - tests/profiles/test_loader.py::test_load_selected_profile_sanitizes_invalid_yaml_diagnostics
      - tests/profiles/test_loader.py::test_load_selected_profile_rejects_duplicate_yaml_keys_without_leak
      - tests/profiles/test_loader.py::test_load_selected_profile_rejects_unhashable_yaml_mapping_key_without_leak
    carryover_gates:
      - gate: diagnostics_privacy_carryover
        status: deferred
        expected_suite: diagnostic_sanitization
        rationale: Current in-memory and CLI privacy is proven; generated result and later diagnostic surfaces remain runner/results and evidence work.
    requirement_refs:
      - docs/implementation/errors-and-diagnostics.md: Parse diagnostics
      - docs/implementation/errors-and-diagnostics.md: Configuration diagnostics
      - docs/compatibility/public-contract-inventory.md: Profile and secret handling
    notes: >
      Resource YAML can contain source/target query text, and profile YAML can
      contain credentials or rendered values. Duplicate-key and invalid-key
      protections must not leak authored keys, profile targets, credentials, or
      source/target snippets through diagnostics.
  - id: aggregate-service-output-privacy
    title: Aggregate setup, capability and CLI diagnostics suppress private data
    area: diagnostics-privacy
    bug_class: diagnostics
    owner_surface: source_target_privacy
    severity: P2
    current_tests:
      - tests/services/test_run_service_aggregate_admission.py::test_aggregate_factory_diagnostics_do_not_publish_private_data
      - tests/services/test_run_service_aggregate_admission.py::test_aggregate_setup_preserves_distinct_connection_failures
      - tests/services/test_run_service_aggregate_admission.py::test_aggregate_unknown_required_capability_is_sanitized
      - tests/services/test_run_service_aggregate_admission.py::test_native_aggregate_cli_privacy_and_artifact_immutability
    carryover_gates:
      - gate: check_engine_semantics_carryover
        status: covered
        expected_suite: aggregate_result_privacy
      - gate: diagnostics_privacy_carryover
        status: deferred
        expected_suite: aggregate_result_privacy
        rationale: Current in-memory and CLI privacy is proven; generated result and later diagnostic surfaces remain runner/results and evidence work.
      - gate: artifact_publication_carryover
        status: deferred
        expected_suite: aggregate_result_privacy
        rationale: Current run preserves existing files and writes no outputs; generated run-result publication remains runner/results work.
      - gate: cli_behavior_carryover
        status: deferred
        expected_suite: aggregate_result_privacy
        rationale: Current CLI outcomes are proven; final terminal summary and result-artifact exit-code contract remain runner/results work.
    requirement_refs:
      - docs/compatibility/public-contract-inventory.md: Aggregate metric execution
      - docs/planning/milestone-7-4-prework.md: Acceptance And Conformance Matrix
    notes: >
      Fixed diagnostic categories suppress arbitrary adapter fields and unknown capability names. Duplicate setup failures for one connection are collapsed without losing failures from distinct connections. Actual CLI pass/fail/error output and logs omit raw data and preserve all existing project files without generated runtime outputs.
  - id: local-resource-config-strict-validation
    title: Local resource policy validates ranges and suppresses untrusted config text
    area: diagnostics-privacy
    bug_class: diagnostics
    owner_surface: redaction
    severity: P2
    current_tests:
      - tests/config/test_project_config.py::test_local_resource_policy_values
      - tests/config/test_project_config.py::test_local_resource_policy_mib_overflow
      - tests/config/test_project_config.py::test_local_resource_policy_invalid_mapping
      - tests/config/test_project_config.py::test_scoped_resource_policy_accepts_documented_modes
      - tests/config/test_project_config.py::test_scoped_resource_policy_rejects_invalid_modes_without_leak
      - tests/config/test_project_config.py::test_scoped_resource_policy_rejects_wrong_envelope
      - tests/profiles/test_loader.py::test_selected_target_rejects_invalid_operational_policy
      - tests/profiles/test_loader.py::test_selected_target_keeps_operational_policy_out_of_connection_payload
      - tests/profiles/test_loader.py::test_selected_target_rejects_duckdb_policy_for_non_duckdb_connection
    carryover_gates:
      - gate: diagnostics_privacy_carryover
        status: deferred
        expected_suite: resource_policy_diagnostics
        rationale: Full runtime and terminal resource diagnostics remain required in the owning implementation and publication phases.
      - gate: parser_compiler_contract_carryover
        status: deferred
        expected_suite: resource_policy_configuration
        rationale: Later configuration expansion must preserve strict optional settings and safe diagnostic behavior.
    requirement_refs:
      - docs/planning/milestone-8-1-2-prework.md: Configuration and precedence
    notes: >
      Reject malformed fields, bools, invalid units and overflow; never expose
      untrusted nested keys or values. Private scratch paths are not echoed.
      Scoped replacement tests are test-first and pending GREEN; retain
      historical candidate nodes until their verified replacements are integrated.
