schema_version: 1
area: parser-compiler
captures:
  - id: yaml-loader-duplicate-key-protection
    title: YAML loading rejects duplicate and unsupported mapping keys
    area: parser-compiler
    bug_class: contract_yaml
    owner_surface: parser
    severity: P2
    current_tests:
      - tests/parser/test_yaml_loader.py::test_load_yaml_text_reports_duplicate_yaml_keys
      - tests/parser/test_yaml_loader.py::test_load_yaml_text_reports_unhashable_mapping_keys
      - tests/config/test_project_config.py::test_load_project_config_reports_duplicate_yaml_keys
      - tests/config/test_project_config.py::test_load_project_config_reports_unhashable_yaml_mapping_key
      - tests/profiles/test_loader.py::test_load_selected_profile_rejects_duplicate_yaml_keys_without_leak
      - tests/profiles/test_loader.py::test_load_selected_profile_rejects_unhashable_yaml_mapping_key_without_leak
    carryover_gates:
      - gate: parser_compiler_contract_carryover
        status: pending
        expected_suite: yaml_loading
    requirement_refs:
      - docs/implementation/errors-and-diagnostics.md: Parse diagnostics
      - docs/implementation/errors-and-diagnostics.md: Configuration diagnostics
    notes: >
      Shared YAML-loader refactors must preserve duplicate-key rejection and
      unsupported mapping-key rejection across resource, project config, and
      profile YAML without changing public parser/config diagnostic ownership.
  - id: compile-diagnostic-render-sql-precedence
    title: Compile diagnostics block render-sql before profile or adapter setup
    area: parser-compiler
    bug_class: compiler
    owner_surface: compiler
    severity: P2
    current_tests:
      - tests/services/test_compile_service.py::test_render_sql_compile_reports_compile_validation_before_profile_errors
      - tests/services/test_compile_service.py::test_render_sql_compile_marks_renderable_checks_blocked_when_compile_validation_fails
    carryover_gates:
      - gate: parser_compiler_contract_carryover
        status: pending
        expected_suite: compile_diagnostics
    requirement_refs:
      - docs/implementation/contract-compiler-and-validation.md: Compiler output model
      - docs/implementation/cli-services.md: Compile service boundary
    notes: >
      `recon compile --render-sql` must preserve compiler diagnostic
      precedence. When compile validation already produced diagnostics, render
      SQL should mark compiled checks blocked where artifacts exist, write no
      SQL files, and avoid profile loading, adapter setup, and renderer
      selection.
  - id: regression-capture-orphan-marker-guard
    title: Regression-capture markers require matching capture metadata
    area: parser-compiler
    bug_class: regression_capture_metadata
    owner_surface: compatibility_validation_tooling
    severity: P2
    current_tests:
      - tests/scripts/test_check_regression_capture.py::test_validator_rejects_regression_capture_markers_without_capture_rows
      - tests/scripts/test_check_regression_capture.py::test_validator_rejects_regression_capture_markers_missing_from_current_tests
    carryover_gates:
      - gate: parser_compiler_contract_carryover
        status: pending
        expected_suite: regression_capture_metadata
    requirement_refs:
      - docs/compatibility/regression-capture/README.md: Row Shape
      - docs/implementation/testing-plan.md: Regression capture metadata validation
    notes: >
      Marked regression tests must not become disconnected from the capture
      row and current-test metadata that future agents and shared suites use for
      carryover decisions.
  - id: regression-capture-decision-advisory-partial-surface-coverage
    title: Regression-capture decision advisory reports uncovered surfaces per gate
    area: parser-compiler
    bug_class: regression_capture_metadata
    owner_surface: compatibility_validation_tooling
    severity: P2
    current_tests:
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_reports_uncovered_surfaces_when_same_gate_has_existing_capture
    carryover_gates:
      - gate: parser_compiler_contract_carryover
        status: pending
        expected_suite: regression_capture_metadata
    requirement_refs:
      - docs/compatibility/regression-capture/README.md: Advisory Decision Check
      - docs/implementation/testing-plan.md: Regression capture metadata validation
    notes: >
      A capture row or no-capture rationale for one surface under a carryover
      gate must not hide other changed surfaces that still need an explicit
      regression-capture decision.
  - id: regression-capture-decision-advisory-scan-budget-surface
    title: Regression-capture decision advisory maps scan-budget policy to scan safety
    area: parser-compiler
    bug_class: regression_capture_metadata
    owner_surface: compatibility_validation_tooling
    severity: P2
    current_tests:
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_maps_scan_budget_module_to_scan_safety_surface
    carryover_gates:
      - gate: parser_compiler_contract_carryover
        status: pending
        expected_suite: regression_capture_metadata
    requirement_refs:
      - docs/compatibility/regression-capture/README.md: Advisory Decision Check
      - docs/compatibility/regression-capture/index.yml: adapter_testkit_regression_carryover
      - docs/implementation/testing-plan.md: Regression capture metadata validation
    notes: >
      Scan-budget policy lives in the check-engine module but must still trigger
      scan-safety carryover classification so future scan-budget-only changes
      cannot bypass adapter test-kit regression-capture decisions.
  - id: regression-capture-decision-advisory-metadata-routing
    title: Regression-capture decision advisory path routing is metadata-driven
    area: parser-compiler
    bug_class: regression_capture_metadata
    owner_surface: compatibility_validation_tooling
    severity: P2
    current_tests:
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_uses_path_surface_routing_from_index
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_maps_yaml_and_profile_modules_to_carryover_surfaces
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_maps_compiled_artifact_schema_modules_to_carryover_surfaces
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_maps_runtime_safety_modules_to_scan_safety_surface
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_maps_duckdb_renderer_modules_to_sql_rendering_surface
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_maps_check_engine_split_modules_to_owned_surfaces
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_maps_compile_service_split_modules_to_owned_surfaces
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_maps_adapter_redaction_helpers_to_diagnostic_privacy_surfaces
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_maps_regression_capture_tooling_to_metadata_surface
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_maps_regression_capture_metadata_files_to_metadata_surface
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_fails_when_path_surface_routing_is_missing
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_fails_when_path_surface_routing_names_unknown_surface
      - tests/scripts/test_check_regression_capture.py::test_validator_rejects_invalid_path_surface_routing
    carryover_gates:
      - gate: parser_compiler_contract_carryover
        status: pending
        expected_suite: regression_capture_metadata
    requirement_refs:
      - docs/compatibility/regression-capture/README.md: Advisory Decision Check
      - docs/compatibility/regression-capture/index.yml: path_surface_routing
      - docs/implementation/testing-plan.md: Regression capture metadata validation
    notes: >
      Path-to-surface routing belongs in regression-capture metadata, not in
      Python script constants. The advisory must load routing from `index.yml`,
      fail closed when that routing is missing or malformed, and the hard
      metadata validator must reject routes that name unknown trigger surfaces.
      Profile connection-reference paths must route to profile diagnostics and
      secret-handling carryover, runtime safety and scan-guard paths must route
      to scan-safety carryover, and regression-capture tooling plus metadata
      files must route to metadata carryover so future changes cannot fall
      through to unrelated or missing surfaces.
  - id: regression-capture-decision-advisory-branch-wide-mode
    title: Regression-capture decision advisory has an explicit branch-wide mode
    area: parser-compiler
    bug_class: regression_capture_metadata
    owner_surface: compatibility_validation_tooling
    severity: P2
    current_tests:
      - tests/scripts/test_check_regression_capture_decisions.py::test_changed_paths_from_git_includes_branch_diff_when_base_ref_is_set
      - tests/scripts/test_check_regression_capture_decisions.py::test_main_base_ref_uses_branch_wide_changed_paths
      - tests/scripts/test_check_regression_capture_decisions.py::test_main_base_ref_fails_when_ref_cannot_be_resolved
    carryover_gates:
      - gate: parser_compiler_contract_carryover
        status: pending
        expected_suite: regression_capture_metadata
    requirement_refs:
      - docs/compatibility/regression-capture/README.md: Advisory Decision Check
      - docs/implementation/testing-plan.md: Regression capture metadata validation
    notes: >
      The default advisory command is intentionally scoped to local WIP and
      untracked files. Branch-wide reviews and final branch validation must use
      an explicit, resolvable base ref so committed branch changes are not
      missed or silently skipped.
