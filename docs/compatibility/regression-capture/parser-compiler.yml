schema_version: 1
area: parser-compiler
captures:
  - id: regression-capture-orphan-marker-guard
    title: Regression-capture markers require matching capture metadata
    area: parser-compiler
    bug_class: regression_capture_metadata
    owner_surface: compatibility_validation_tooling
    severity: P2
    current_tests:
      - tests/scripts/test_check_regression_capture.py::test_validator_rejects_regression_capture_markers_without_capture_rows
      - tests/scripts/test_check_regression_capture.py::test_validator_rejects_regression_capture_markers_missing_from_current_tests
    carryover_gates:
      - gate: parser_compiler_contract_carryover
        status: pending
        expected_suite: regression_capture_metadata
    requirement_refs:
      - docs/compatibility/regression-capture/README.md: Row Shape
      - docs/implementation/testing-plan.md: Regression capture metadata validation
    notes: >
      Marked regression tests must not become disconnected from the capture
      row and current-test metadata that future agents and shared suites use for
      carryover decisions.
  - id: regression-capture-decision-advisory-partial-surface-coverage
    title: Regression-capture decision advisory reports uncovered surfaces per gate
    area: parser-compiler
    bug_class: regression_capture_metadata
    owner_surface: compatibility_validation_tooling
    severity: P2
    current_tests:
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_reports_uncovered_surfaces_when_same_gate_has_existing_capture
    carryover_gates:
      - gate: parser_compiler_contract_carryover
        status: pending
        expected_suite: regression_capture_metadata
    requirement_refs:
      - docs/compatibility/regression-capture/README.md: Advisory Decision Check
      - docs/implementation/testing-plan.md: Regression capture metadata validation
    notes: >
      A capture row or no-capture rationale for one surface under a carryover
      gate must not hide other changed surfaces that still need an explicit
      regression-capture decision.
  - id: regression-capture-decision-advisory-scan-budget-surface
    title: Regression-capture decision advisory maps scan-budget policy to scan safety
    area: parser-compiler
    bug_class: regression_capture_metadata
    owner_surface: compatibility_validation_tooling
    severity: P2
    current_tests:
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_maps_scan_budget_module_to_scan_safety_surface
    carryover_gates:
      - gate: parser_compiler_contract_carryover
        status: pending
        expected_suite: regression_capture_metadata
    requirement_refs:
      - docs/compatibility/regression-capture/README.md: Advisory Decision Check
      - docs/compatibility/regression-capture/index.yml: adapter_testkit_regression_carryover
      - docs/implementation/testing-plan.md: Regression capture metadata validation
    notes: >
      Scan-budget policy lives in the check-engine module but must still trigger
      scan-safety carryover classification so future scan-budget-only changes
      cannot bypass adapter test-kit regression-capture decisions.
  - id: regression-capture-decision-advisory-metadata-routing
    title: Regression-capture decision advisory path routing is metadata-driven
    area: parser-compiler
    bug_class: regression_capture_metadata
    owner_surface: compatibility_validation_tooling
    severity: P2
    current_tests:
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_uses_path_surface_routing_from_index
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_maps_runtime_safety_modules_to_scan_safety_surface
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_fails_when_path_surface_routing_is_missing
      - tests/scripts/test_check_regression_capture_decisions.py::test_advisory_fails_when_path_surface_routing_names_unknown_surface
      - tests/scripts/test_check_regression_capture.py::test_validator_rejects_invalid_path_surface_routing
    carryover_gates:
      - gate: parser_compiler_contract_carryover
        status: pending
        expected_suite: regression_capture_metadata
    requirement_refs:
      - docs/compatibility/regression-capture/README.md: Advisory Decision Check
      - docs/compatibility/regression-capture/index.yml: path_surface_routing
      - docs/implementation/testing-plan.md: Regression capture metadata validation
    notes: >
      Path-to-surface routing belongs in regression-capture metadata, not in
      Python script constants. The advisory must load routing from `index.yml`,
      fail closed when that routing is missing or malformed, and the hard
      metadata validator must reject routes that name unknown trigger surfaces.
      Runtime safety and scan-guard paths must route to scan-safety carryover
      so future scan-safety behavior changes cannot fall through to generic
      adapter API/capability surfaces only.
  - id: regression-capture-decision-advisory-branch-wide-mode
    title: Regression-capture decision advisory has an explicit branch-wide mode
    area: parser-compiler
    bug_class: regression_capture_metadata
    owner_surface: compatibility_validation_tooling
    severity: P2
    current_tests:
      - tests/scripts/test_check_regression_capture_decisions.py::test_changed_paths_from_git_includes_branch_diff_when_base_ref_is_set
      - tests/scripts/test_check_regression_capture_decisions.py::test_main_base_ref_uses_branch_wide_changed_paths
      - tests/scripts/test_check_regression_capture_decisions.py::test_main_base_ref_fails_when_ref_cannot_be_resolved
    carryover_gates:
      - gate: parser_compiler_contract_carryover
        status: pending
        expected_suite: regression_capture_metadata
    requirement_refs:
      - docs/compatibility/regression-capture/README.md: Advisory Decision Check
      - docs/implementation/testing-plan.md: Regression capture metadata validation
    notes: >
      The default advisory command is intentionally scoped to local WIP and
      untracked files. Branch-wide reviews and final branch validation must use
      an explicit, resolvable base ref so committed branch changes are not
      missed or silently skipped.
