  - id: scratch-namespace-qualification
    title: Stable scratch namespaces revalidate storage and object privacy
    area: adapter-runtime
    bug_class: scan_safety
    owner_surface: adapter_runtime
    severity: P2
    current_tests:
      - tests/adapters/test_resource_scratch.py::test_check_scratch_requires_existing_directory
      - tests/adapters/test_resource_scratch.py::test_check_scratch_uses_private_posix_directory
