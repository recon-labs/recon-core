      owner and DACL through a directory handle. Mode bits and inherited
      defaults alone do not prove Windows privacy.
      Process identity does not authorize an impersonating thread; retain
      uncertainty until an equivalent worker security context is proven.
      Inspect actual leaf ACLs as well as directories; inherited or explicit
      owner-only file grants may qualify, but additional trustees do not.
      Windows can assign the built-in Administrators group as the default
      leaf owner; verify that exact privileged owner separately from the sole
      user grant. Directory ownership remains strictly the current user.
      Compare native volume and full file identifiers of independently opened
      handles; reject mismatched, reparse, delete-pending or unexpected objects.
      Ancestor ACL candidate distinguishes effective path-control grants from
      harmless read/traverse/add-subdirectory and inherit-only entries;
      unknown ACL shapes remain unqualified, not blanket platform refusal.
      Recognize the exact Windows Modules Installer service SID for ancestors,
      never arbitrary service SIDs or relaxed ownership of private objects.

