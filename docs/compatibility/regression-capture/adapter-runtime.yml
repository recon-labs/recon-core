      - tests/adapters/test_scratch_namespace.py::test_stable_project_namespace_and_recovery
      - tests/adapters/test_scratch_namespace.py::test_namespace_does_not_adopt_arbitrary_directory
      - tests/adapters/test_scratch_namespace.py::test_unknown_filesystem_does_not_authorize_creation
      - tests/adapters/test_scratch_namespace.py::test_changed_mount_retains_existing_storage
      - tests/adapters/test_scratch_namespace.py::test_windows_broadened_root_file_refuses_reopen
      - tests/adapters/test_scratch_namespace.py::test_windows_broadened_session_file_is_retained
      - tests/adapters/test_scratch_namespace.py::test_windows_file_acl_checks_actual_open_handle
      - tests/adapters/test_scratch_namespace.py::test_windows_unsafe_ancestor_refuses_namespace_creation
      - tests/adapters/test_scratch_namespace.py::test_windows_changed_ancestor_retains_existing_storage
      - tests/adapters/test_scratch_namespace.py::test_windows_shared_read_and_add_directory_ancestor_remains_usable
      - tests/adapters/test_scratch_namespace.py::test_darwin_broadened_root_file_refuses_reopen
      - tests/adapters/test_scratch_namespace.py::test_darwin_broadened_session_file_is_retained
      - tests/adapters/test_scratch_namespace.py::test_darwin_deny_only_file_acl_remains_usable
      - tests/adapters/test_scratch_namespace.py::test_darwin_file_acl_checks_actual_open_handle
      - tests/adapters/test_scratch_namespace.py::test_posix_file_mount_checks_actual_open_handle
      - tests/adapters/test_scratch_namespace.py::test_linux_same_device_file_bind_mount_retains_storage
      - tests/adapters/test_scratch_namespace.py::test_windows_tickets_persist_full_native_object_identity
      - tests/adapters/test_scratch_namespace.py::test_windows_legacy_markers_are_not_adopted_or_deleted
      - tests/adapters/test_scratch_namespace.py::test_concurrent_namespace_creation_reopens_completed_winner
    carryover_gates:
      - gate: adapter_testkit_regression_carryover
        status: deferred
        expected_suite: native_resource_worker_lifecycle
        rationale: Directory qualification is a prerequisite, not full worker, file ACL or storage admission proof.
    requirement_refs:
      - docs/planning/milestone-8-1-2-prework.md: B9 and A10
    notes: >
      Scope the stable root by native user and canonical project location.
      Revalidate directory privacy and actual filesystem evidence during
      creation and recovery; do not adopt arbitrary existing directories.
      Unknown storage needs independent protection before admission.
      Native Windows marker and lock operations also inspect the opened
      file ACL; recovery retains broadened marker, lock and spill files.
      Revalidate the complete Windows base ancestor chain before creation,
      reopen, session operations and recovery. Shared read and add-directory
      rights may qualify; path-control grants must not authorize storage.
      Inspect Darwin extended leaf ACLs on the actual operation descriptor;
      retain data when ACL grants or descriptor identity cannot be qualified.
      Compare POSIX native mount identity of named and actual open leaves to
      the qualified base; same-device bind mounts cannot authorize cleanup.
      Persist full Windows volume serial and 128-bit object identity in native
      ticket markers; older candidate markers remain untouched and unqualified.
      Worker qualification and stable ancestry remain prerequisites.
