schema_version: 1
allowed_statuses:
  - pending
  - covered
  - migrated
  - deferred
  - not_applicable
capture_files:
  - path: adapter-runtime.yml
    area: adapter-runtime
    description: Adapter runtime, scan-safety, capability, and cross-repo adapter cases.
  - path: check-engine.yml
    area: check-engine
    description: Check-engine semantics, blocker/dependency behavior, and execution-result cases.
  - path: diagnostics-privacy.yml
    area: diagnostics-privacy
    description: Diagnostic rendering, redaction, and source/target privacy cases.
  - path: artifacts.yml
    area: artifacts
    description: Generated artifact publication, cleanup, freshness, and state/evidence artifact cases.
  - path: cli.yml
    area: cli
    description: Command, option, exit-code, terminal-output, selector, and debug-command behavior.
  - path: parser-compiler.yml
    area: parser-compiler
    description: Parser, compiler, contract YAML, check-pack, typed-plan, and validation-default behavior.
