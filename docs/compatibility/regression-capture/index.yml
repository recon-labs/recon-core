gates:
  adapter_testkit_regression_carryover:
    primary_milestone: adapter_test_kit_and_package_split
    primary_milestone_title: Adapter test kit and adapter package split
    applies_to:
      - adapter test kit implementation
      - adapter package extraction
      - external adapter repositories
      - any adapter execution expansion
      - query endpoint execution if adapter conformance is involved
      - adapter result or evidence sink writes
    trigger_surfaces:
      - adapter_runtime
      - adapter_api
      - adapter_capabilities
      - sql_rendering
      - scan_safety
      - cross_repo_compatibility
      - python_package_imports
  check_engine_semantics_carryover:
    primary_milestone: aggregate_metric_execution
    primary_milestone_title: Aggregate metric execution
    applies_to:
      - aggregate metric execution
      - aggregate metrics expansion
      - row-level value check execution
      - CDC execution
      - any new executable check type
      - any blocker or dependency semantic change
    trigger_surfaces:
      - check_engine
      - typed_check_plan
      - execution_result
      - prerequisite_blocking
  diagnostics_privacy_carryover:
    primary_milestone: runner_and_results
    primary_milestone_title: Runner and results
    applies_to:
      - runner and results
      - evidence reporting
      - future debug commands
      - adapter test-kit diagnostics
      - advanced evidence
      - source-location diagnostics
      - any diagnostic, log, failure-detail, evidence, or debug surface
    trigger_surfaces:
      - diagnostics
      - profile_secrets
      - redaction
      - source_target_privacy
      - adapter_diagnostics
      - debug_output
  artifact_publication_carryover:
    primary_milestone: runner_and_results
    primary_milestone_title: Runner and results
    applies_to:
      - runner and results
      - evidence reporting
      - artifact freshness and cache optimization
      - selected-scope artifacts
      - local state
      - advanced evidence
      - remote or database state
      - any generated artifact writer or cleanup surface
    trigger_surfaces:
      - generated_artifacts
      - artifact_lifecycle
      - run_results
      - evidence
      - state
      - cache_freshness
  cli_behavior_carryover:
    primary_milestone: runner_and_results
    primary_milestone_title: Runner and results
    applies_to:
      - runner and results
      - minimal selectors
      - rich selectors
      - future CLI commands and options
      - documentation generation commands
      - any CLI command, option, terminal output, or exit-code change
    trigger_surfaces:
      - cli
      - exit_codes
      - terminal_output
      - selectors
      - debug_commands
  parser_compiler_contract_carryover:
    primary_milestone: aggregate_metrics_expansion
    primary_milestone_title: Aggregate metrics expansion
    applies_to:
      - aggregate metrics expansion
      - explicit source-target column mapping
      - check-pack invocation config
      - local and package resource loading
      - executable query endpoints
      - public contract schema stabilization
      - any YAML schema, validation default, check-pack expansion, or typed-plan change
    trigger_surfaces:
      - parser
      - compiler
      - contract_yaml
      - check_packs
      - regression_capture_metadata
      - typed_check_plan
      - validation_defaults
