version: 1

name: orders_cdc

source:
  connection: source_db
  relation: recon.v_orders_source_compare

target:
  connection: warehouse
  relation: recon.v_orders_target_compare

grain:
  keys:
    - order_id

columns:
  exact:
    - status
  numeric:
    - name: total_amount
      tolerance: 0.01
  timestamp:
    - name: updated_at
      tolerance: 5 seconds

cdc:
  mode: upsert
  keys:
    same_as: grain
  timestamp_column: updated_at
  delete_mode: soft_delete
  source_deleted_column: is_deleted
  target_deleted_column: is_deleted

schema:
  ignore_target_columns:
    - _dms_operation
    - _dms_timestamp
    - _loaded_at

checks:
  use:
    - recon_core.basic_equivalence
    - recon_core.cdc_equivalence

sampling:
  default_policy: latest_changed_records

evidence:
  level: detailed
  store_failures: true
  max_failure_rows: 1000
