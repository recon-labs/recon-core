name: Temporary M8.1.2 native lock evidence
on:
  push:
    branches: [experiment/m812-native-lock-20261126]
    paths: ['.github/workflows/temporary-m812-native-lock.yml']
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -ra tests/adapters/test_scratch_filesystem.py tests/adapters/test_resource_scratch.py tests/adapters/test_windows_scratch_security.py
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --diff src/recon_core/adapters/_scratch_filesystem.py src/recon_core/adapters/_resource_scratch.py tests/adapters/test_scratch_filesystem.py tests/adapters/test_resource_scratch.py
        continue-on-error: true
      - run: ruff check src/recon_core/adapters/_scratch_filesystem.py src/recon_core/adapters/_resource_scratch.py tests/adapters/test_scratch_filesystem.py tests/adapters/test_resource_scratch.py
        continue-on-error: true
      - run: mypy src
        continue-on-error: true
      - run: python scripts/check_regression_capture_decisions.py --base-ref b001d14de1fb613beaaad1f3e914f81dfb125cac
      - name: Verify permission-denied-as-live-owner regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("src/recon_core/adapters/_resource_scratch.py")
          s=p.read_text()
          old="                _lock_exclusive(stream.fileno())\n            except OSError:\n                raise _ScratchError() from None"
          assert old in s
          p.write_text(s.replace(old, old.replace("raise _ScratchError()", "raise _BusyError()"), 1))
          PY
          set +e
          pytest -q tests/adapters/test_resource_scratch.py::test_lock_permission_error_is_not_live_owner > mutation.log 2>&1
          result=$?
          set -e
          cat mutation.log
          test "$result" -eq 1
          grep -q 'AssertionError' mutation.log
          git restore src/recon_core/adapters/_resource_scratch.py
          rm mutation.log
