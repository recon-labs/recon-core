name: Temporary Windows owner-relative ancestor proof
on:
  push:
    branches:
      - experiment/m812-windows-owner-rights-20261126
permissions:
  contents: read
jobs:
  platform:
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c48c94c395a054b88c13ffcc7d0790c6ea6aa5e0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -ra tests/adapters/test_windows_scratch_security.py tests/adapters/test_scratch_namespace.py tests/adapters/test_resource_scratch.py tests/adapters/test_scratch_filesystem.py
  negative:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 739a8ee8b528947705ce951542b36e067c30e4d2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Actual pre-fix owner-relative grant rejection
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/adapters/test_windows_scratch_security.py -k owner_rights_follow > red.log 2>&1
          status=$?
          set -e
          cat red.log
          test "$status" -eq 1
          grep -F "1 failed" red.log
          grep -F "Windows scratch privacy could not be verified" red.log
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c48c94c395a054b88c13ffcc7d0790c6ea6aa5e0
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: python scripts/check_regression_capture.py
      - run: python scripts/check_regression_capture_decisions.py --base-ref b001d14de1fb613beaaad1f3e914f81dfb125cac
