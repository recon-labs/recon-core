name: Temporary final adaptive resource calibration
on:
  push:
    branches: [experiment/m812-final-adaptive-calibration-20261127]
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        duckdb: ['1.0.0', '1.3.2', '1.4.5', '2.0.1']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Measured native project execution under actual capacity
        shell: bash
        env:
          PIN: ${{ matrix.duckdb }}
        run: |
          set -euo pipefail
          ROOT=$(mktemp -d)
          trap 'sudo umount "$ROOT/low" 2>/dev/null || true; sudo rm -rf "$ROOT"' EXIT
          mkdir "$ROOT/project" "$ROOT/scratch" "$ROOT/low"
          chmod 700 "$ROOT/project" "$ROOT/scratch"
          truncate -s 64M "$ROOT/low.img"
          mkfs.ext4 -q -F "$ROOT/low.img"
          sudo mount -o loop "$ROOT/low.img" "$ROOT/low"
          sudo chown "$(id -u):$(id -g)" "$ROOT/low"
          sudo rmdir "$ROOT/low/lost+found"
          printf 'FROM python:3.11-slim\nWORKDIR /app\nCOPY . /app\nRUN pip install --no-cache-dir -e ".[dev,duckdb]" duckdb==%s\n' "$PIN" > "$ROOT/Dockerfile"
          docker build -q -f "$ROOT/Dockerfile" -t recon-m812-calibration .
          USER_ARGS=(--user "$(id -u):$(id -g)" --network none --rm)
          docker run "${USER_ARGS[@]}" --memory 2g --cpus 2 -v "$ROOT/project:/fixture:rw" recon-m812-calibration python -u scripts/temporary_m812_final_calibration.py setup /fixture
          for spec in "512 large fixed scratch" "512 large auto scratch" "512 large percent scratch" "2048 large capable scratch" "512 small fixed scratch" "512 large low-disk low"; do
            read -r ram kind mode storage <<< "$spec"
            echo "CASE $spec"
            timeout --kill-after=5s 120s docker run "${USER_ARGS[@]}" --memory "${ram}m" --memory-swap "${ram}m" --cpus 2 -v "$ROOT/project:/fixture:rw" -v "$ROOT/$storage:/scratch:rw" recon-m812-calibration python -u scripts/temporary_m812_final_calibration.py run /fixture /scratch "$kind" "$mode"
          done
