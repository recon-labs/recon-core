name: Temporary final adaptive resource calibration
on:
  push:
    branches: [experiment/m812-final-adaptive-calibration-20261127]
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        duckdb: ['1.0.0', '1.3.2', '1.4.5', '2.0.1']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Measured native project execution under actual capacity
        shell: bash
        env:
          PIN: ${{ matrix.duckdb }}
        run: |
          set -euo pipefail
          ROOT=$(mktemp -d)
          trap 'docker rm -f recon-m812-case >/dev/null 2>&1 || true; sudo umount "$ROOT/low" 2>/dev/null || true; sudo rm -rf "$ROOT"' EXIT
          mkdir "$ROOT/project" "$ROOT/scratch" "$ROOT/low"
          chmod 700 "$ROOT/project" "$ROOT/scratch"
          truncate -s 64M "$ROOT/low.img"
          mkfs.ext4 -q -F "$ROOT/low.img"
          sudo mount -o loop "$ROOT/low.img" "$ROOT/low"
          sudo chown "$(id -u):$(id -g)" "$ROOT/low"
          sudo rmdir "$ROOT/low/lost+found"
          printf 'FROM python:3.11-slim\nWORKDIR /app\nCOPY . /app\nRUN pip install --no-cache-dir -e ".[dev,duckdb]" duckdb==%s\n' "$PIN" > "$ROOT/Dockerfile"
          docker build -q -f "$ROOT/Dockerfile" -t recon-m812-calibration .
          USER_ARGS=(--user "$(id -u):$(id -g)" --network none)
          docker run "${USER_ARGS[@]}" --rm --memory 2g --cpus 2 -v "$ROOT/project:/fixture:rw" recon-m812-calibration python -u -m scripts.temporary_m812_final_calibration setup /fixture
          status=0
          cases=()
          for repeat in 1 2 3; do
            for mode in guide125 guide125-quarter; do
              cases+=("512 large $mode scratch 2" "512 small $mode scratch 2" "512 large $mode tmpfs 2" "1024 small $mode scratch 4" "2048 large $mode scratch 4")
            done
          done
          for spec in "${cases[@]}"; do
            read -r ram kind mode storage cpus <<< "$spec"
            echo "CASE $spec"
            CASE_DIR=$(mktemp -d "$ROOT/scratch/case-XXXXXX")
            if [ "$storage" = tmpfs ]; then
              STORAGE=(--tmpfs "/scratch:rw,size=1g,uid=$(id -u),gid=$(id -g),mode=0700")
            elif [ "$storage" = low ]; then
              STORAGE=(-v "$ROOT/low:/scratch:rw")
            else
              STORAGE=(-v "$CASE_DIR:/scratch:rw")
            fi
            rc=0
            timeout --kill-after=5s 120s docker run --name recon-m812-case "${USER_ARGS[@]}" --memory "${ram}m" --memory-swap "${ram}m" --cpus "$cpus" -v "$ROOT/project:/fixture:rw" "${STORAGE[@]}" recon-m812-calibration python -u -m scripts.temporary_m812_final_calibration run /fixture /scratch "$kind" "$mode" || rc=$?
            docker inspect --format 'CONTAINER OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' recon-m812-case
            docker rm -f recon-m812-case >/dev/null
            if [ "$rc" -ne 0 ]; then
              echo "CASE_FAILED $spec exit=$rc"
              status=1
            fi
          done
          exit "$status"
