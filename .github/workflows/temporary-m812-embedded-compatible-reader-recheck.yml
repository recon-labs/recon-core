name: Temporary compatible reader embedded recheck
on:
  push:
    branches: [experiment/m812-embedded-compatible-reader-recheck-20261127]
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11', duckdb: '1.0.0'}
          - {os: ubuntu-latest, python: '3.12', duckdb: '1.3.2'}
          - {os: ubuntu-latest, python: '3.12', duckdb: '1.4.5'}
          - {os: ubuntu-latest, python: '3.13', duckdb: '2.0.1'}
          - {os: macos-15, python: '3.11', duckdb: '1.0.0'}
          - {os: macos-latest, python: '3.13', duckdb: '2.0.1'}
          - {os: windows-2022, python: '3.11', duckdb: '1.0.0'}
          - {os: windows-latest, python: '3.13', duckdb: '2.0.1'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b001d14de1fb613beaaad1f3e914f81dfb125cac
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" "duckdb==${{ matrix.duckdb }}"
      - name: Run actual existing service and binding tests with candidate connection factory
        shell: bash
        env:
          RECON_REQUIRE_DUCKDB_TESTS: '1'
        run: |
          cat > temporary_instance_plugin.py <<'PY'
          import tempfile
          import shutil
          from pathlib import Path
          from types import SimpleNamespace
          import pytest
          import duckdb
          from recon_core.adapters.duckdb import _bound_execution as binding
          
          class GuardedConnection:
              def __init__(self,actor,guard,scratch):
                  self.actor=actor
                  self.guard=guard
                  self.scratch=scratch
              def __getattr__(self,name):
                  return getattr(self.actor,name)
              def close(self):
                  # Release actor before original native writer exclusion.
                  self.actor.close()
                  self.guard.close()
                  shutil.rmtree(self.scratch)
          
          def connect(database,*,read_only):
              assert read_only
              guard=duckdb.connect(database,read_only=True)
              actor=None
              scratch=None
              try:
                  native=guard.execute("select current_database()").fetchone()[0]
                  scratch=Path(tempfile.mkdtemp(prefix="recon-guarded-probe-")).resolve()
                  actor=duckdb.connect(":memory:",config={"memory_limit":"256MiB","threads":"1","temp_directory":str(scratch)})
                  if native.lower()=="memory":
                      actor.execute("ATTACH ':memory:' AS recon_seed")
                      actor.execute("USE recon_seed")
                      actor.execute("DETACH memory")
                  literal=database.replace("'","''")
                  actor.execute(f"ATTACH '{literal}' (READ_ONLY)")
                  rows=actor.execute("pragma database_list").fetchall()
                  matches=[r[1] for r in rows if r[2] and Path(r[2]).resolve()==Path(database).resolve()]
                  assert matches==[native]
                  actor.execute('USE "'+native.replace('"','""')+'"')
                  if native.lower()=="memory":
                      actor.execute("DETACH recon_seed")
                  actor.execute("SET max_temp_directory_size='512MiB'")
                  return GuardedConnection(actor,guard,scratch)
              except BaseException:
                  if actor is not None: actor.close()
                  guard.close()
                  if scratch is not None: shutil.rmtree(scratch)
                  raise
          
          @pytest.fixture(autouse=True)
          def guarded_native_instance(monkeypatch):
              monkeypatch.setattr(binding,"import_module",lambda name:SimpleNamespace(connect=connect))
              yield
          PY
          python -m pytest -p temporary_instance_plugin -q -ra tests/services/test_run_service_bound_execution.py tests/services/test_run_service_duckdb_execution.py tests/services/test_run_service_aggregate_admission.py tests/adapters/test_duckdb_bound_execution.py -k 'test_native_row_count_uses_owned_read_only_session or test_row_count_refuses_view_scope or test_actual_session_and_aliases_writer_conflict or test_run_service_executes_actual_duckdb or test_run_service_allows_key_safety_duckdb or test_run_service_blocks_key_safety_duckdb_view or test_run_service_executes_valid_row_count_and_key_safety_checks or test_native_aggregate_service_numeric_outcomes_and_privacy or test_native_aggregate_service_null_and_empty_outcomes or test_native_grouped_service_distinguishes_absence_from_null or test_native_grouped_service_rejects_incompatible_key_types or test_native_grouped_service_high_cardinality_remains_private or test_qualified_relation_binding or test_owned_session_refuses_new_sidecar or test_lease_invalidation'
      - name: Existing WAL fixture baseline (Windows only, evidence not candidate qualification)
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: python -m pytest -q -ra tests/services/test_run_service_duckdb_execution.py -k test_run_service_blocks_key_safety_duckdb_wal_sidecar_before_adapter_setup
      - name: Native catalog, read-only write rejection and cancellation probes
        if: always()
        shell: bash
        run: |
          cat > test_temporary_native_instance.py <<'PY'
          import threading
          import time
          import hashlib
          from pathlib import Path
          import pytest
          import duckdb
          from recon_core.adapters.duckdb import _bound_execution as binding
          from recon_core.adapters.duckdb.runtime_scan_guard import _local_file_identity
          from recon_core.profiles import ConnectionConfig
          
          def digest(p):
              return hashlib.sha256(p.read_bytes()).digest()
          
          @pytest.mark.parametrize("filename",["ordinary.duckdb","space quote ' ü.duckdb","odd.name.data","memory.duckdb","temp.duckdb","system.duckdb"])
          def test_native_catalog_names_and_readonly(tmp_path,filename):
              path=tmp_path/filename
              with duckdb.connect(str(path)) as c:
                  c.execute("create table src as select 1 as id")
                  c.execute("create table dst as select 1 as id")
                  native_catalog=c.execute("select current_database()").fetchone()[0]
              before=digest(path)
              identity=_local_file_identity(ConnectionConfig(name="warehouse",type="duckdb",config={"database":filename}),tmp_path)
              assert identity is not None
              session=binding._OwnedDuckDbSession(identity)
              try:
                  session.open()
                  lease=session.bind(check_id="synthetic",operation="row_count_diff",source="src",target="dst")
                  assert lease is not None
                  assert lease.scope.source.catalog==native_catalog
                  c=session._connection
                  with pytest.raises(Exception) as e:
                      c.execute("create table must_not_exist(i int)")
                  assert "read-only" in str(e.value).lower() or "read only" in str(e.value).lower()
              finally:
                  assert session.close()==()
              assert digest(path)==before
              with duckdb.connect(str(path)) as writer:
                  assert writer.execute("select count(*) from src").fetchone()==(1,)
          
          def test_interrupt_independent_instance(tmp_path):
              path=tmp_path/"cancel.duckdb"
              with duckdb.connect(str(path)) as c:
                  c.execute("create table src as select 1 as id")
                  c.execute("create table dst as select 1 as id")
              before=digest(path)
              identity=_local_file_identity(ConnectionConfig(name="warehouse",type="duckdb",config={"database":path.name}),tmp_path)
              assert identity is not None
              session=binding._OwnedDuckDbSession(identity)
              try:
                  with duckdb.connect(str(path),read_only=True) as observer:
                      baseline=observer.execute("select current_setting('memory_limit'),current_setting('threads'),current_setting('temp_directory')").fetchone()
                      session.open()
                      lease=session.bind(check_id="synthetic",operation="row_count_diff",source="src",target="dst")
                      assert lease is not None
                      c=session._connection
                      started=threading.Event()
                      errors=[]
                      def work():
                          started.set()
                          try:
                              c.execute("select sum(sin(i::double)) from range(1000000000) t(i)").fetchone()
                          except Exception as e:
                              errors.append(type(e).__name__)
                      thread=threading.Thread(target=work,daemon=True)
                      thread.start()
                      assert started.wait(5)
                      time.sleep(.15)
                      assert thread.is_alive()
                      c.interrupt()
                      thread.join(10)
                      if thread.is_alive():
                          import os
                          os._exit(2)
                      assert errors==["InterruptException"]
                      assert observer.execute("select count(*) from src").fetchone()==(1,)
                      assert observer.execute("select current_setting('memory_limit'),current_setting('threads'),current_setting('temp_directory')").fetchone()==baseline
              finally:
                  assert session.close()==()
              assert session.released and digest(path)==before

          def test_concurrent_embedded_runs(tmp_path):
              from concurrent.futures import ThreadPoolExecutor
              from recon_core.services import RunService
              from recon_core.services.results import ExitCategory
              from tests.services._run_service_fixtures import (
                  _all_key_safety_checks,_compiled_check_payload,row_count_plan,write_duckdb_key_safety_run_inputs,
              )
              from tests.services.test_run_service_aggregate_admission import _aggregate_check
              from tests.services.test_run_service_bound_execution import _CapturingEngine
              path=tmp_path/"warehouse.duckdb"
              with duckdb.connect(str(path)) as c:
                  c.execute("create schema qa")
                  c.execute("create table qa.source_customers as select i::integer AS customer_id,1::integer AS month,5::bigint AS revenue from range(1000) t(i)")
                  c.execute("create table qa.target_customers as select * from qa.source_customers")
              checks=[_compiled_check_payload(operations=row_count_plan()),*_all_key_safety_checks(),_aggregate_check(tolerance=0),_aggregate_check(grouped=True,tolerance=0)]
              write_duckdb_key_safety_run_inputs(tmp_path,path,checks=checks)
              before=digest(path)
              def run():
                  engine=_CapturingEngine()
                  result=RunService(start_path=tmp_path,engine=engine).execute()
                  assert result.exit_category is ExitCategory.SUCCESS
                  assert engine.result is not None
                  statuses=[c.status.value for contract in engine.result.contract_results for c in contract.check_results]
                  assert statuses==["pass"]*9
              with duckdb.connect(str(path),read_only=True) as observer:
                  query="select current_setting('memory_limit'),current_setting('threads'),current_setting('max_temp_directory_size'),current_setting('temp_directory')"
                  baseline=observer.execute(query).fetchone()
                  with ThreadPoolExecutor(max_workers=2) as pool:
                      jobs=[pool.submit(run) for _ in range(2)]
                      while not all(job.done() for job in jobs):
                          assert observer.execute(query).fetchone()==baseline
                          assert observer.execute("select count(*) from qa.source_customers").fetchone()==(1000,)
                          time.sleep(.01)
                      for job in jobs: job.result()
                  assert observer.execute(query).fetchone()==baseline
              assert digest(path)==before
              with duckdb.connect(str(path)) as c:
                  assert c.execute("select count(*) from qa.source_customers").fetchone()==(1000,)
          PY
          python -m pytest -p temporary_instance_plugin -q -ra test_temporary_native_instance.py
          rm -f temporary_instance_plugin.py test_temporary_native_instance.py
  spill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        duckdb: ['1.3.2', '1.4.5', '2.0.1']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b001d14de1fb613beaaad1f3e914f81dfb125cac
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native defaults versus configured controls under real memory limits
        env:
          PIN: ${{ matrix.duckdb }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(mktemp -d)
          trap 'docker rm -f recon-native-first >/dev/null 2>&1 || true; rm -rf "$ROOT"; rm -f scripts/temporary_native_first_spill.py' EXIT
          mkdir "$ROOT/fixture" "$ROOT/scratch"
          touch "$ROOT/scratch/probe-owned"
          cat > scripts/temporary_native_first_spill.py <<'PY'
          """Temporary synthetic disk-backed spill and owned-worker experiments."""
          import json
          import os
          import shutil
          import signal
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path
          from types import SimpleNamespace
          
          import duckdb
          from recon_core.adapters import ConnectionConfig
          from recon_core.adapters.duckdb import _bound_execution as binding
          from recon_core.adapters.duckdb._aggregate_runtime import _DuckDbAggregateRuntimeRenderer
          from recon_core.adapters.duckdb.runtime_scan_guard import _local_file_identity
          
          MIB=1024**2
          def log(tag,**values):
              print(tag,json.dumps(values,sort_keys=True,default=str),flush=True)
          
          def bytes_in(root):
              total=0
              for parent,dirs,files in os.walk(root):
                  for name in files:
                      try:total+=(Path(parent)/name).stat().st_size
                      except FileNotFoundError:pass
              return total

          def setup(root):
              db=root/"large.duckdb"
              n=3000000
              wide="||".join(f"md5((i+{j*n})::varchar)" for j in range(8))
              c=duckdb.connect(str(db),config={"threads":"2","memory_limit":"768MiB"})
              try:
                  c.execute(f"create table src as select i k,{wide} wide,5::bigint v from range({n}) q(i)")
                  c.execute("create table dst as select * from src")
                  c.execute("checkpoint")
              finally:c.close()
              assert db.stat().st_size>512*MIB
              log("FIXTURE",n=n,bytes=db.stat().st_size)
          
          class GuardedConnection:
              def __init__(self,actor,guard):
                  self.actor=actor
                  self.guard=guard
              def __getattr__(self,name):
                  return getattr(self.actor,name)
              def close(self):
                  self.actor.close()
                  self.guard.close()
          
          def connect(db,spill,mem,threads,cap):
              db=Path(db)
              guard=duckdb.connect(str(db),read_only=True)
              c=None
              try:
                  native=guard.execute("select current_database()").fetchone()[0]
                  c=duckdb.connect(":memory:",config={"threads":str(threads),"memory_limit":f"{mem}MiB","temp_directory":str(spill)})
                  literal=str(db).replace("'","''")
                  c.execute(f"ATTACH '{literal}' (READ_ONLY)")
                  rows=c.execute("pragma database_list").fetchall()
                  matches=[r[1] for r in rows if r[2] and Path(r[2]).resolve()==db.resolve()]
                  assert matches==[native]
                  c.execute('USE "'+native.replace('"','""')+'"')
                  c.execute(f"SET max_temp_directory_size='{cap}MiB'")
                  log("SETTINGS",values=c.execute("select current_setting('memory_limit'),current_setting('threads'),current_setting('max_temp_directory_size')").fetchone())
                  return GuardedConnection(c,guard)
              except BaseException as e:
                  log("SYNTHETIC_INIT_FAILURE",kind=type(e).__name__,message=str(e).replace(str(db),"<fixture>").replace(str(spill),"<scratch>")[:300])
                  if c is not None:c.close()
                  guard.close()
                  raise

          def child(root,scratch,key,mem,threads,cap):
              db=root/"large.duckdb"
              spill=scratch/"spill"
              spill.mkdir()
              ident=_local_file_identity(ConnectionConfig(name="local",type="duckdb",config={"database":db.name}),root)
              assert ident is not None
              if mem:
                  binding.import_module=lambda name:SimpleNamespace(connect=lambda path,read_only:connect(path,spill,mem,threads,cap))
              observer=duckdb.connect(str(db),read_only=True)
              q="select current_setting('memory_limit'),current_setting('threads'),current_setting('max_temp_directory_size'),current_setting('temp_directory')"
              baseline=observer.execute(q).fetchone()
              s=binding._OwnedDuckDbSession(ident)
              try:
                  s.open()
                  native=s._connection.execute("select current_setting('memory_limit'),current_setting('threads'),current_setting('max_temp_directory_size'),current_setting('temp_directory')").fetchone()
                  log("NATIVE",memory=native[0],threads=native[1],spill_cap=native[2],temp_kind=("empty" if not native[3] else "database_sidecar" if str(native[3])==str(db)+".tmp" else "configured" if str(native[3])==str(spill) else "other"))
                  lease=s.bind(check_id="synthetic",operation="grouped_aggregate_diff",source="main.src",target="main.dst")
                  assert lease is not None
                  ops=tuple({"type":"grouped_aggregate","side":side,"aggregate":"sum","column":"v","group_by":[key]} for side in ("source","target"))+({"type":"compare_grouped_aggregates"},)
                  plan=_DuckDbAggregateRuntimeRenderer().render_bound_grouped_plan(ops,source_relation=lease.scope.source,target_relation=lease.scope.target)
                  for g in plan.type_guards:
                      assert s._read_bound_aggregate(lease,lease.scope,g.sql,expected_columns=("type_check",)).row==(1,)
                  proof=s._read_bound_aggregate(lease,lease.scope,plan.domain_guard.sql,expected_columns=("numeric_domain",))
                  (scratch/"active").touch()
                  t=time.monotonic()
                  result=s._read_bound_aggregate(lease,lease.scope,plan.final_query(plan.domain_from_guard(proof)).sql,expected_columns=plan.columns)
                  assert result.row==(3000000,0,0,0,0,3000000,0,0,0)
                  assert observer.execute(q).fetchone()==baseline
                  log("RESULT",ok=True,seconds=round(time.monotonic()-t,4),observer_unchanged=True)
              except Exception as e:
                  log("RESULT",ok=False,error=type(e).__name__,code=getattr(getattr(e,"diagnostic",None),"code",None))
              finally:
                  log("CLOSE",released=s.close()==() and s.released,spill_remaining=bytes_in(spill),sidecar_remaining=Path(str(db)+".tmp").exists())
                  log("OBSERVER",unchanged=observer.execute(q).fetchone()==baseline,usable=observer.execute("select count(*) from src").fetchone()==(3000000,))
                  observer.close()
          
          def parent(root,mode,key,mem,threads,cap):
              base=Path("/scratch")
              assert (base/"probe-owned").is_file()
              scratch=Path(tempfile.mkdtemp(prefix="case-",dir=base))
              cg=Path("/sys/fs/cgroup")
              log("ENV",version=duckdb.__version__,memory_max=(cg/"memory.max").read_text().strip(),cpu_max=(cg/"cpu.max").read_text().strip(),scratch_free=shutil.disk_usage(base).free)
              db=root/"large.duckdb"
              before=db.stat()
              observer=None
              fill=None
              if mode=="cancel":
                  observer=duckdb.connect(str(db),read_only=True,config={"memory_limit":"96MiB","threads":"1","temp_directory":str(scratch/"observer")})
                  before=observer.execute("select current_setting('memory_limit'),current_setting('threads')").fetchone()
              if mode=="full":
                  fill=scratch/"filler"
                  free=shutil.disk_usage(base).free
                  with fill.open("wb") as f:os.posix_fallocate(f.fileno(),0,max(0,free-8*MIB))
                  log("LOW_DISK",free=shutil.disk_usage(base).free)
              try:
                  with tempfile.TemporaryFile(mode="w+t") as out:
                      proc=subprocess.Popen([sys.executable,__file__,"child",str(root),str(scratch),key,str(mem),str(threads),str(cap)],stdout=out,stderr=subprocess.STDOUT,start_new_session=True)
                      peak=0; sidecar_seen=False; reason=None; t=time.monotonic()
                      try:
                          while proc.poll() is None:
                              sidecar_seen=sidecar_seen or Path(str(db)+".tmp").exists()
                              peak=max(peak,bytes_in(scratch/"spill")+bytes_in(Path(str(db)+".tmp")))
                              if mode=="cancel" and (scratch/"active").is_file() and peak>0:
                                  reason="active_spill_cancel";break
                              if time.monotonic()-t>55:
                                  reason="deadline";break
                              time.sleep(.02)
                          if reason is not None and proc.poll() is None:
                              os.killpg(proc.pid,signal.SIGTERM)
                              try:proc.wait(timeout=3)
                              except subprocess.TimeoutExpired:
                                  os.killpg(proc.pid,signal.SIGKILL);proc.wait(timeout=3)
                      finally:
                          if proc.poll() is None:
                              os.killpg(proc.pid,signal.SIGKILL);proc.wait(timeout=3)
                      out.seek(0);print(out.read(),end="",flush=True)
                      log("SUPERVISOR",reason=reason,exit=proc.returncode,peak_spill_bytes=peak,sidecar_seen=sidecar_seen,stopped=proc.poll() is not None,spill_after_exit=bytes_in(scratch/"spill"))
                  if observer is not None:
                      after=observer.execute("select current_setting('memory_limit'),current_setting('threads')").fetchone()
                      assert observer.execute("select count(*) from main.src").fetchone()==(3000000,)
                      log("ISOLATION",before=before,after=after,unchanged=before==after)
              finally:
                  if observer is not None:observer.close()
                  shutil.rmtree(scratch)
                  after=db.stat()
                  log("CLEANUP",removed=not scratch.exists(),free=shutil.disk_usage(base).free,db_unchanged=(before.st_size,before.st_mtime_ns)==(after.st_size,after.st_mtime_ns),sidecar_exists=Path(str(db)+".tmp").exists())
          if __name__=="__main__":
              if sys.argv[1]=="setup":setup(Path(sys.argv[2]))
              elif sys.argv[1]=="child":child(Path(sys.argv[2]),Path(sys.argv[3]),sys.argv[4],int(sys.argv[5]),int(sys.argv[6]),int(sys.argv[7]))
              else:parent(Path(sys.argv[2]),sys.argv[3],sys.argv[4],int(sys.argv[5]),int(sys.argv[6]),int(sys.argv[7]))
          PY
          python -m pip install -e . "duckdb==$PIN"
          python -u scripts/temporary_native_first_spill.py setup "$ROOT/fixture"
          printf 'FROM python:3.11-slim\nWORKDIR /app\nCOPY . /app\nRUN pip install --no-cache-dir . duckdb==%s\n' "$PIN" > "$ROOT/Dockerfile"
          docker build -q -f "$ROOT/Dockerfile" -t recon-native-first .
          for spec in "512 128 1 1024 k" "2048 768 1 4096 wide"; do
            read -r ram mem threads cap key <<< "$spec"
            echo "CASE $spec"
            set +e
            timeout --kill-after=5s 75s docker run --name recon-native-first --network none --memory "${ram}m" --memory-swap "${ram}m" --cpus 2 -v "$ROOT/fixture:/fixture:ro" -v "$ROOT/scratch:/scratch:rw" recon-native-first python -u scripts/temporary_native_first_spill.py parent /fixture normal "$key" "$mem" "$threads" "$cap"
            rc=$?
            set -e
            docker inspect --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' recon-native-first || true
            docker rm -f recon-native-first >/dev/null || true
            echo "CASE_EXIT $rc"
            if test -e "$ROOT/fixture/large.duckdb.tmp"; then
              echo "EXPERIMENT_ONLY_SIDE_CAR_RETAINED true"
              sudo rm -rf "$ROOT/fixture/large.duckdb.tmp"
            fi
          done
          rm -f scripts/temporary_native_first_spill.py
          sudo rm -rf "$ROOT"
          test ! -e "$ROOT"
          echo ROOT_CLEANUP true
