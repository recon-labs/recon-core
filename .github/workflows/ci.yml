name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff format check
        run: |
          ruff format --check .

      - name: Ruff lint
        run: |
          ruff check .

      - name: Type check
        run: |
          mypy src

      - name: Test
        run: |
          pytest

      - name: Pre-commit
        run: |
          pre-commit run --all-files

  duckdb-semantics:
    name: DuckDB Semantics
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with DuckDB extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,duckdb]"

      - name: Test DuckDB semantic coverage
        env:
          RECON_REQUIRE_DUCKDB_TESTS: "1"
        run: |
          pytest tests/adapters tests/check_engine tests/services tests/cli

  duckdb-version-compatibility:
    name: DuckDB Version Compatibility
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - duckdb-version: "1.0.0"
            numeric-selection: "not bignum"
          - duckdb-version: "1.3.2"
            numeric-selection: "not bignum"
          - duckdb-version: "1.4.5"
            numeric-selection: ""
          - duckdb-version: "2.0.1"
            numeric-selection: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned DuckDB
        env:
          DUCKDB_VERSION: ${{ matrix.duckdb-version }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,duckdb]" "duckdb==${DUCKDB_VERSION}"
          python -c 'import duckdb, os; print(duckdb.__version__); assert duckdb.__version__ == os.environ["DUCKDB_VERSION"]'

      - name: Test existing and numeric semantic coverage
        env:
          RECON_REQUIRE_DUCKDB_TESTS: "1"
          NUMERIC_SELECTION: ${{ matrix.numeric-selection }}
        run: |
          status=0
          pytest tests/adapters tests/check_engine tests/services tests/cli --ignore=tests/adapters/test_duckdb_aggregate_numeric_domains.py || status=1
          if [ -n "$NUMERIC_SELECTION" ]; then
            pytest -s tests/adapters/test_duckdb_aggregate_numeric_domains.py -k "$NUMERIC_SELECTION" || status=1
          else
            pytest -s tests/adapters/test_duckdb_aggregate_numeric_domains.py || status=1
          fi
          exit "$status"
