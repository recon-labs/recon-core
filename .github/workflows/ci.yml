name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff format check
        run: |
          ruff format --check .

      - name: Ruff lint
        run: |
          ruff check .

      - name: Type check
        run: |
          mypy src

      - name: Test
        run: |
          pytest

      - name: Pre-commit
        run: |
          pre-commit run --all-files

  duckdb-sql-rendering:
    name: DuckDB SQL Rendering
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with DuckDB extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,duckdb]"

      - name: Test DuckDB SQL renderer semantics
        env:
          RECON_REQUIRE_DUCKDB_TESTS: "1"
        run: |
          pytest tests/adapters/test_duckdb_sql_renderer.py
