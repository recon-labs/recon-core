name: Temporary M8.1.2 portable observation proof
on:
  push:
    branches: [experiment/m812-portable-observation-check-20261126]
    paths: ['.github/workflows/temporary-m812-portable-check.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,duckdb]" "psutil==7.2.2"
      - run: ruff format --diff src/recon_core/adapters/_portable_resource_observation.py src/recon_core/adapters/_local_resource_observation.py tests/adapters/test_portable_resource_observation.py
        continue-on-error: true
      - run: ruff check src/recon_core/adapters/_portable_resource_observation.py src/recon_core/adapters/_local_resource_observation.py tests/adapters/test_portable_resource_observation.py
        continue-on-error: true
      - run: mypy src
        continue-on-error: true
      - run: pytest tests/adapters/test_portable_resource_observation.py tests/adapters/test_local_resource_observation.py tests/compatibility/test_python_package_exports.py
      - run: python scripts/check_regression_capture_decisions.py --base-ref b001d14de1fb613beaaad1f3e914f81dfb125cac
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,duckdb]" "psutil==7.2.2"
      - name: Actual platform observations and native Windows job test
        shell: bash
        run: |
          python -c 'from pathlib import Path; import tempfile; from recon_core.adapters._local_resource_observation import _observe_local_resources; d=tempfile.TemporaryDirectory(); x=_observe_local_resources(Path(d.name)); print(x); assert x.host_available_bytes is not None and x.portable.process_rss_bytes>0 and x.scratch_free_bytes>0; d.cleanup()'
          pytest -ra tests/adapters/test_portable_resource_observation.py tests/adapters/test_local_resource_observation.py
