name: Temporary Windows volume root diagnostic
on:
  push:
    branches:
      - experiment/m812-windows-volume-root-20261126
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4cc24109621c2b20f1c8e4d4c4c52f64652abacf
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect root descriptor without identifying values
        shell: pwsh
        run: |
          $root = [IO.Path]::GetPathRoot([IO.Path]::GetTempPath())
          $acl = Get-Acl -LiteralPath $root
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User
          function Classify-Sid($sid) {
            if ($sid -eq $user) { return 'CurrentUser' }
            foreach ($kind in @('LocalSystemSid','BuiltinAdministratorsSid','BuiltinUsersSid','WorldSid','AuthenticatedUserSid','CreatorOwnerSid','LocalServiceSid','NetworkServiceSid')) {
              if ($sid.IsWellKnown([Security.Principal.WellKnownSidType]::$kind)) { return $kind }
            }
            if ($sid.Value -eq 'S-1-5-80-956008885-3418522649-1831038044-1853292631-2271478464') { return 'TrustedInstallerService' }
            return 'Other'
          }
          Write-Output "Owner=$(Classify-Sid ($acl.GetOwner([Security.Principal.SecurityIdentifier]))); protected=$($acl.AreAccessRulesProtected)"
          foreach ($rule in $acl.GetAccessRules($true,$true,[Security.Principal.SecurityIdentifier])) {
            Write-Output "principal=$(Classify-Sid $rule.IdentityReference); rights=$([int]$rule.FileSystemRights); inherited=$($rule.IsInherited); type=$($rule.AccessControlType); inheritance=$($rule.InheritanceFlags); propagation=$($rule.PropagationFlags)"
          }
      - name: Inspect native rejection stage
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          @'
          from pathlib import Path
          import tempfile
          from recon_core.adapters import _windows_scratch_security as n
          p = Path(Path(tempfile.gettempdir()).anchor)
          def wrap(name):
              fn = getattr(n, name)
              def observed(*args, **kwargs):
                  try:
                      result = fn(*args, **kwargs)
                  except Exception:
                      print(name, "failed")
                      raise
                  if name == "_ancestor_trusted_principal":
                      print(name, bool(result))
                  return result
              setattr(n, name, observed)
          for name in ("_native_object_identity", "_confirm_native_identity", "_ancestor_trusted_principal", "_verify_descriptor"):
              wrap(name)
          try:
              n._verify_ancestor_directory(p)
          except n._WindowsScratchSecurityError:
              print("root unqualified")
          else:
              print("root qualified")
          '@ | python -
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4cc24109621c2b20f1c8e4d4c4c52f64652abacf
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: python scripts/check_regression_capture.py
      - run: python scripts/check_regression_capture_decisions.py --base-ref b001d14de1fb613beaaad1f3e914f81dfb125cac
