name: Temporary Darwin leaf ACL proof
on:
  push:
    branches:
      - experiment/m812-darwin-leaf-acl-20261127
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0beb060dbb811bb7e88bb544c895fa588f9f9d8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -ra tests/adapters/test_windows_scratch_security.py tests/adapters/test_scratch_namespace.py tests/adapters/test_resource_scratch.py tests/adapters/test_scratch_filesystem.py
  negative:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 18716c70ddb0200bdb26baa450010d1443dab5a1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Actual pre-fix Darwin leaf privacy failures
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/adapters/test_scratch_namespace.py -k 'darwin_broadened or darwin_deny_only_file or darwin_file_acl_checks' > red.log 2>&1
          status=$?
          set -e
          cat red.log
          test "$status" -eq 1
          grep -F "DID NOT RAISE" red.log
          grep -F "6 failed, 1 passed" red.log
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0beb060dbb811bb7e88bb544c895fa588f9f9d8
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: python scripts/check_regression_capture.py
      - run: python scripts/check_regression_capture_decisions.py --base-ref b001d14de1fb613beaaad1f3e914f81dfb125cac
