name: Temporary Windows native ticket identity proof
on:
  push:
    branches:
      - experiment/m812-windows-ticket-identity-20261127
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2cb75091f7c9b316b2ca4fe42a904c6382476a06
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -ra tests/adapters/test_windows_scratch_security.py tests/adapters/test_scratch_namespace.py tests/adapters/test_resource_scratch.py tests/adapters/test_scratch_filesystem.py
      - if: runner.os == 'Linux'
        env:
          RECON_TEST_NATIVE_BIND_MOUNT: '1'
        run: python -m pytest -q tests/adapters/test_scratch_namespace.py -k linux_same_device_file_bind
  negative:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f7bc7bc34ebcee3ee309bb7d74c68b7ab4c95150
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Actual pre-fix native width regression
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/adapters/test_scratch_namespace.py -k 'windows_tickets_persist and True' > red.log 2>&1
          status=$?
          set -e
          cat red.log
          test "$status" -eq 1
          grep -F "1 failed" red.log
          grep -F "AssertionError: assert" red.log
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2cb75091f7c9b316b2ca4fe42a904c6382476a06
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: python scripts/check_regression_capture.py
      - run: python scripts/check_regression_capture_decisions.py --base-ref b001d14de1fb613beaaad1f3e914f81dfb125cac
