name: Temporary M8.1.2 Windows ACL negative proof
on:
  push:
    branches: [experiment/m812-windows-acl-red-20261126]
    paths: ['.github/workflows/temporary-m812-windows-acl-red.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: pytest -ra tests/adapters/test_windows_scratch_security.py
      - name: Verify missing actual DACL validation is detected
        shell: pwsh
        run: |
          python -c "from pathlib import Path; p=Path('src/recon_core/adapters/_windows_scratch_security.py'); s=p.read_text(); old='_verify_descriptor(security, handle, sid, kernel)'; assert old in s; p.write_text(s.replace(old, 'pass', 1))"
          pytest -q tests/adapters/test_windows_scratch_security.py::test_native_acl_broadening_is_rejected *> mutation.log
          $result = $LASTEXITCODE
          Get-Content mutation.log
          git restore src/recon_core/adapters/_windows_scratch_security.py
          if ($result -ne 1 -or -not (Select-String -Path mutation.log -Pattern 'DID NOT RAISE' -Quiet)) { exit 1 }
          Remove-Item mutation.log
          exit 0
