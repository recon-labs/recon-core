name: Temporary M8.1.2 observation validation
on:
  push:
    branches: [experiment/m812-resource-observation-check-20261126]
    paths: ['.github/workflows/temporary-m812-observation-check.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --diff src/recon_core/adapters/_local_resource_observation.py tests/adapters/test_local_resource_observation.py
        continue-on-error: true
      - run: ruff check src/recon_core/adapters/_local_resource_observation.py tests/adapters/test_local_resource_observation.py
        continue-on-error: true
      - run: mypy src
        continue-on-error: true
      - run: pytest tests/adapters/test_local_resource_observation.py tests/config/test_project_config.py tests/check_engine/test_local_resource_targets.py
      - run: python scripts/check_regression_capture_decisions.py --base-ref b001d14de1fb613beaaad1f3e914f81dfb125cac
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" psutil==7.2.2
      - name: Observe platform facts and test cross-platform parser fixtures
        shell: bash
        run: |
          python -c 'import json, os, psutil, tempfile; from pathlib import Path; from recon_core.adapters._local_resource_observation import _observe_local_resources; p=psutil.Process(); d=tempfile.TemporaryDirectory(); x=_observe_local_resources(Path(d.name)); print(json.dumps(dict(platform=x.platform, host_available=psutil.virtual_memory().available, cpu_count=os.cpu_count(), affinity_available=hasattr(p,"cpu_affinity"), process_rss=p.memory_info().rss, scratch_free=x.scratch_free_bytes, linux_memory=x.memory_headroom_bytes, scratch_memory_backed=x.scratch_memory_backed, partition_types=sorted(set(m.fstype for m in psutil.disk_partitions(all=True)))))); assert psutil.virtual_memory().available>0 and x.scratch_free_bytes>0; d.cleanup()'
          pytest tests/adapters/test_local_resource_observation.py
