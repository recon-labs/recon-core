name: Temporary M8.1.2 branch-wide capture audit
on:
  push:
    branches: [experiment/m812-branchwide-capture-20261127]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6681f479ab84eb18ceb59c541092b9f565578792
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact branch capture and advisory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6681f479ab84eb18ceb59c541092b9f565578792"
          git merge-base HEAD origin/main
          python -m pip install -e ".[dev]"
          python scripts/check_regression_capture.py
          python scripts/check_regression_capture_decisions.py --base-ref origin/main --fail-on-findings
