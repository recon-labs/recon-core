name: Temporary M8.1.2 corrected runtime resources
on:
  push:
    branches: [experiment/m8-1-2-corrected-resources-20261126]
    paths: ['scripts/temporary_m812_resource_probe.py', '.github/workflows/temporary-m812-resource-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        duckdb: ['1.0.0', '1.3.2', '1.4.5', '2.0.1']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pin
        env:
          PIN: ${{ matrix.duckdb }}
        run: |
          python -m pip install -e . "duckdb==$PIN"
          python -c 'import duckdb,os; assert duckdb.__version__ == os.environ["PIN"]'
      - run: python -u scripts/temporary_m812_resource_probe.py
