name: Temporary M8.1.2 automatic resource calibration
on:
  push:
    branches: [experiment/m812-disk-worker-proof-20261126]
    paths: ['.github/workflows/temporary-m812-calibration.yml']
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        duckdb: ['1.0.0', '1.3.2', '1.4.5', '2.0.1']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare candidate automatic controls on real Recon grouped SQL
        env:
          PIN: ${{ matrix.duckdb }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(mktemp -d)
          MOUNT="$ROOT/scratch"
          mkdir "$MOUNT" "$ROOT/fixture"
          trap 'docker rm -f recon-m812-cal >/dev/null 2>&1 || true; if mountpoint -q "$MOUNT"; then sudo umount "$MOUNT"; fi; rm -rf "$ROOT"' EXIT
          python -m pip install -e . "duckdb==$PIN"
          python -u scripts/temporary_m812_calibration.py setup "$ROOT/fixture"
          truncate -s 8192M "$ROOT/scratch.img"
          mkfs.ext4 -q -F -m 0 "$ROOT/scratch.img"
          sudo mount -o loop "$ROOT/scratch.img" "$MOUNT"
          sudo chmod 777 "$MOUNT"
          touch "$MOUNT/probe-owned"
          findmnt -n -o FSTYPE,SOURCE --target "$MOUNT"
          printf 'FROM python:3.11-slim\nWORKDIR /app\nCOPY . /app\nRUN pip install --no-cache-dir . duckdb==%s\n' "$PIN" > "$ROOT/Dockerfile"
          docker build -q -f "$ROOT/Dockerfile" -t recon-m812-cal .
          for spec in "512 k auto50" "512 k auto75" "512 k native" "4096 wide auto50" "4096 wide auto75" "4096 wide native"; do
            read -r ram key mode <<< "$spec"
            echo "CASE $spec"
            set +e
            timeout --kill-after=5s 75s docker run --name recon-m812-cal --network none --memory "${ram}m" --memory-swap "${ram}m" --cpus 2 -v "$ROOT/fixture:/fixture:ro" -v "$MOUNT:/scratch:rw" recon-m812-cal python -u scripts/temporary_m812_calibration.py parent /fixture "$mode" "$key" 1 1 6144
            rc=$?
            set -e
            docker inspect --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' recon-m812-cal || true
            docker rm -f recon-m812-cal >/dev/null || true
            echo "CASE_EXIT $rc"
            sudo find "$MOUNT" -mindepth 1 -maxdepth 1 -name 'case-*' -type d -exec rm -rf {} +
          done
          sudo umount "$MOUNT"
          rm -rf "$ROOT"
          test ! -e "$ROOT"
          echo ROOT_CLEANUP true
