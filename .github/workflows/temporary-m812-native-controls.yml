name: Temporary M8.1.2 native controls proof
on:
  push:
    branches: [experiment/m812-native-control-validation-20261126]
    paths: ['.github/workflows/temporary-m812-native-controls.yml']
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        duckdb: ['1.0.0', '1.3.2', '1.4.5', '2.0.1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,duckdb]" "duckdb==${{ matrix.duckdb }}"
      - name: Test native controls
        env:
          RECON_REQUIRE_DUCKDB_TESTS: '1'
        run: pytest -ra tests/adapters/test_duckdb_native_resource_controls.py
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,duckdb]" "duckdb==1.0.0"
      - run: ruff format --diff src/recon_core/adapters/duckdb/_native_resource_controls.py tests/adapters/test_duckdb_native_resource_controls.py
        continue-on-error: true
      - run: ruff check src/recon_core/adapters/duckdb/_native_resource_controls.py tests/adapters/test_duckdb_native_resource_controls.py
        continue-on-error: true
      - run: mypy src
        continue-on-error: true
      - run: python scripts/check_regression_capture_decisions.py --base-ref b001d14de1fb613beaaad1f3e914f81dfb125cac
      - name: Verify regression catches startup-only spill cap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("src/recon_core/adapters/duckdb/_native_resource_controls.py")
          s=p.read_text()
          s=s.replace('"memory_limit": f"{request.memory_bytes} bytes",','"max_temp_directory_size": f"{request.spill_bytes} bytes",\n        "memory_limit": f"{request.memory_bytes} bytes",')
          s=s.replace('connection.execute(f"SET max_temp_directory_size = \'{request.spill_bytes} bytes\'")','pass')
          assert '"max_temp_directory_size": f"{request.spill_bytes} bytes"' in s
          assert 'connection.execute(f"SET max_temp_directory_size' not in s
          p.write_text(s)
          PY
          set +e
          pytest -q tests/adapters/test_duckdb_native_resource_controls.py::test_native_spill_setting_effect_not_readback > mutation.log 2>&1
          result=$?
          set -e
          cat mutation.log
          test "$result" -eq 1
          grep -q 'Native spill control effect was not established' mutation.log
          git restore src/recon_core/adapters/duckdb/_native_resource_controls.py
          rm mutation.log
