name: Temporary embedded overlap diagnosis
on:
  push:
    branches: [experiment/m812-embedded-overlap-diagnosis-20261127]
permissions:
  contents: read
jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        duckdb: ['1.0.0','1.3.2','1.4.5','2.0.1']
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "duckdb==${{ matrix.duckdb }}"
      - name: Compare native simultaneous readers and attachments
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import json
          import tempfile
          from pathlib import Path
          import duckdb
          
          def emit(**facts):
              print(json.dumps(facts,sort_keys=True),flush=True)
          
          def attach(actor,path):
              literal=str(path).replace("'","''")
              actor.execute(f"ATTACH '{literal}' (READ_ONLY)")
          
          with tempfile.TemporaryDirectory(prefix="recon-overlap-") as name:
              root=Path(name).resolve()
              a=root/"a.duckdb"
              b=root/"b.duckdb"
              for path in (a,b):
                  with duckdb.connect(str(path)) as c:
                      c.execute("create table src as select 1 as id")
              with duckdb.connect(str(a),read_only=True) as guard1, duckdb.connect(str(a),read_only=True) as guard2, duckdb.connect(str(b),read_only=True) as guard3:
                  assert guard1.execute("select count(*) from src").fetchone()==(1,)
                  assert guard2.execute("select count(*) from src").fetchone()==(1,)
                  emit(case="ordinary_readers",success=True)
                  with duckdb.connect(":memory:") as actor1:
                      attach(actor1,a)
                      assert actor1.execute("select count(*) from a.main.src").fetchone()==(1,)
                      for path in (a,b):
                          with duckdb.connect(":memory:") as actor2:
                              try:
                                  attach(actor2,path)
                                  assert actor2.execute(f"select count(*) from {path.stem}.main.src").fetchone()==(1,)
                                  emit(case="overlapping_attachments",same_file=path==a,success=True)
                              except Exception as e:
                                  emit(case="overlapping_attachments",same_file=path==a,success=False,error_type=type(e).__name__,error=str(e).replace(str(root),"<fixture>")[:300])
                      assert actor1.execute("select count(*) from a.main.src").fetchone()==(1,)
                  with duckdb.connect(":memory:") as actor3:
                      attach(actor3,a)
                      assert actor3.execute("select count(*) from a.main.src").fetchone()==(1,)
                  emit(case="after_first_closed",success=True)
          emit(case="cleanup",removed=not Path(name).exists())
          PY
          python "$RUNNER_TEMP/probe.py"
