name: Temporary DuckDB binding probe
on:
  push:
    branches: [experiment/m8-1-connection-binding-20261126]
    paths:
      - .github/workflows/temporary-duckdb-binding.yml
      - scripts/temporary_duckdb_binding.py
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        duckdb: ["1.0.0", "1.3.2", "1.4.5", "2.0.1"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependency
        env:
          VERSION: ${{ matrix.duckdb }}
        run: |
          python -m pip install -e . "duckdb==${VERSION}"
          python -c 'import duckdb,os; assert duckdb.__version__ == os.environ["VERSION"]'
      - run: python scripts/temporary_duckdb_binding.py
