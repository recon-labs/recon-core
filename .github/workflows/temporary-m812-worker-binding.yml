name: Temporary M8.1.2 controlled binding proof
on:
  push:
    branches: [experiment/m812-worker-binding-20261126]
    paths: ['.github/workflows/temporary-m812-worker-binding.yml']
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        duckdb: ['1.0.0', '2.0.1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,duckdb]" "duckdb==${{ matrix.duckdb }}"
      - run: pytest -ra tests/adapters/test_duckdb_worker_bound_session.py tests/adapters/test_duckdb_bound_execution.py -k "worker or controlled or required_setting or owned_controls"
        env:
          RECON_REQUIRE_DUCKDB_TESTS: '1'
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,duckdb]"
      - run: ruff format --diff src/recon_core/adapters/duckdb/_bound_execution.py src/recon_core/adapters/duckdb/_worker_bound_session.py tests/adapters/test_duckdb_bound_execution.py tests/adapters/test_duckdb_worker_bound_session.py
        continue-on-error: true
      - run: ruff check src/recon_core/adapters/duckdb/_bound_execution.py src/recon_core/adapters/duckdb/_worker_bound_session.py tests/adapters/test_duckdb_bound_execution.py tests/adapters/test_duckdb_worker_bound_session.py
        continue-on-error: true
      - run: mypy src
        continue-on-error: true
      - run: python scripts/check_regression_capture_decisions.py --base-ref b001d14de1fb613beaaad1f3e914f81dfb125cac
      - name: Verify regression detects wrong binding acceptance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("src/recon_core/adapters/duckdb/_worker_bound_session.py")
          s=p.read_text()
          old="            or proof != self._proof\n"
          assert old in s
          p.write_text(s.replace(old, "", 1))
          PY
          set +e
          pytest -q 'tests/adapters/test_duckdb_worker_bound_session.py::test_wrong_worker_binding_is_rejected_before_query[nonce]' > mutation.log 2>&1
          result=$?
          set -e
          cat mutation.log
          test "$result" -eq 1
          grep -q 'DID NOT RAISE' mutation.log
          git restore src/recon_core/adapters/duckdb/_worker_bound_session.py
          rm mutation.log
