name: Temporary Windows ancestor ACL proof
on:
  push:
    branches:
      - experiment/m812-windows-ancestor-acl-20261126
permissions:
  contents: read
jobs:
  platform:
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7300652ffbaab54a9e7582182ca1bbe7a960d87
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,duckdb]"
      - run: python -m pytest -q -ra tests/adapters/test_windows_scratch_security.py tests/adapters/test_scratch_namespace.py tests/adapters/test_resource_scratch.py tests/adapters/test_scratch_filesystem.py
      - name: Observe qualification of actual temporary base ancestors
        run: |
          @'
          from pathlib import Path
          import tempfile
          from recon_core.adapters._windows_scratch_security import _verify_ancestor_directory, _WindowsScratchSecurityError
          base = Path(tempfile.gettempdir()).resolve()
          for depth, item in enumerate((base, *base.parents)):
              try:
                  _verify_ancestor_directory(item)
              except _WindowsScratchSecurityError:
                  print(f"ancestor depth={depth}: unqualified")
              else:
                  print(f"ancestor depth={depth}: qualified")
          '@ | python -
  negative:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7300652ffbaab54a9e7582182ca1bbe7a960d87
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Baseline actual ACL cases
        run: python -m pytest -q tests/adapters/test_windows_scratch_security.py -k ancestor_permissions
      - name: Mutation must expose omitted path-control check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/recon_core/adapters/_windows_scratch_security.py")
          s = p.read_text()
          old = "if ace.mask & ~safe and not _ancestor_trusted_principal(security, trustee, sid):"
          assert s.count(old) == 1
          p.write_text(s.replace(old, "if False:"))
          PY
          set +e
          python -m pytest -q tests/adapters/test_windows_scratch_security.py -k ancestor_permissions > red.log 2>&1
          status=$?
          set -e
          git restore src/recon_core/adapters/_windows_scratch_security.py
          cat red.log
          test "$status" -eq 1
          grep -F "DID NOT RAISE" red.log
          grep -F "6 failed, 3 passed" red.log
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7300652ffbaab54a9e7582182ca1bbe7a960d87
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: python scripts/check_regression_capture.py
      - run: python scripts/check_regression_capture_decisions.py --base-ref b001d14de1fb613beaaad1f3e914f81dfb125cac
