name: Temporary M8.1.2 namespace diagnosis
on:
  push:
    branches: [experiment/m812-scratch-namespace-diagnostic-20261126]
    paths: ['.github/workflows/temporary-m812-scratch-namespace-diagnostic.yml']
permissions:
  contents: read
jobs:
  darwin:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - name: Observe actual ACL and ancestor evidence (synthetic paths only)
        shell: bash
        run: |
          python - <<'PY'
          import ctypes as ct
          import os, tempfile
          from pathlib import Path
          from recon_core.adapters._scratch_namespace import _darwin_trivial_acl
          libc=ct.CDLL(None,use_errno=True)
          libc.acl_get_fd_np.argtypes=[ct.c_int,ct.c_int]
          libc.acl_get_fd_np.restype=ct.c_void_p
          libc.acl_get_entry.argtypes=[ct.c_void_p,ct.c_int,ct.POINTER(ct.c_void_p)]
          libc.acl_get_entry.restype=ct.c_int
          libc.acl_get_tag_type.argtypes=[ct.c_void_p,ct.POINTER(ct.c_int)]
          libc.acl_get_tag_type.restype=ct.c_int
          libc.acl_free.argtypes=[ct.c_void_p]
          libc.acl_free.restype=ct.c_int
          print("trivial_symbol",hasattr(libc,"acl_is_trivial_np"))
          with tempfile.TemporaryDirectory() as temp:
              p=Path(temp).resolve()
              for i,path in enumerate((p,*p.parents)):
                  info=path.lstat()
                  fd=os.open(path,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
                  try:
                      ct.set_errno(0)
                      acl=libc.acl_get_fd_np(fd,0x100)
                      print("level",i,"owner_trusted",info.st_uid in (0,os.geteuid()),"mode",oct(info.st_mode&0o7777),"has_acl",bool(acl),"errno",ct.get_errno())
                      if acl:
                          try:
                              entry=ct.c_void_p()
                              entry_id=0
                              for _ in range(129):
                                  ct.set_errno(0)
                                  rc=libc.acl_get_entry(acl,entry_id,ct.byref(entry))
                                  if rc!=0:
                                      print("entry_end",rc,ct.get_errno())
                                      break
                                  tag=ct.c_int()
                                  print("entry_tag",libc.acl_get_tag_type(entry,ct.byref(tag)),tag.value)
                                  entry_id=1
                          finally:
                              libc.acl_free(acl)
                      try:
                          print("provider",_darwin_trivial_acl(path,info))
                      except Exception as exc:
                          print("provider_exception",type(exc).__name__)
                  finally:
                      os.close(fd)
          PY
  negative:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/adapters/test_scratch_namespace.py
      - name: Verify unsafe unknown-storage acceptance is detected
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("src/recon_core/adapters/_scratch_namespace.py")
          s=p.read_text()
          a=s.index("def _usable(")
          z=s.index("\n\n@dataclass",a)
          p.write_text(s[:a]+"def _usable(facts: _FilesystemEvidence) -> bool:\n    return True\n"+s[z:])
          PY
          set +e
          pytest -q tests/adapters/test_scratch_namespace.py::test_unknown_filesystem_does_not_authorize_creation > mutation.log 2>&1
          result=$?
          set -e
          cat mutation.log
          git restore src/recon_core/adapters/_scratch_namespace.py
          test "$result" -eq 1
          grep -q 'DID NOT RAISE' mutation.log
          rm mutation.log
