name: Temporary native direct invocation proof
on:
  push:
    branches: [experiment/m812-direct-invocation-20261127]
permissions:
  contents: read
jobs:
  invocation:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11', duckdb: '1.0.0'}
          - {os: ubuntu-latest, python: '3.12', duckdb: '1.3.2'}
          - {os: ubuntu-latest, python: '3.12', duckdb: '1.4.5'}
          - {os: ubuntu-latest, python: '3.13', duckdb: '2.0.1'}
          - {os: macos-15, python: '3.11', duckdb: '1.0.0'}
          - {os: macos-latest, python: '3.13', duckdb: '2.0.1'}
          - {os: windows-2022, python: '3.11', duckdb: '1.0.0'}
          - {os: windows-latest, python: '3.13', duckdb: '2.0.1'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b001d14de1fb613beaaad1f3e914f81dfb125cac
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" "duckdb==${{ matrix.duckdb }}"
      - name: Ordinary direct CLI invocation with actual nine check families
        shell: bash
        run: |
          cat > temporary_direct_invocation.py <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path
          from types import SimpleNamespace
          import duckdb
          from recon_core.adapters.duckdb import _bound_execution as binding
          from recon_core.cli import main as cli_module
          import importlib
          cli=importlib.import_module("recon_core.cli.main")
          from recon_core.services import RunService
          from tests.services.test_run_service_bound_execution import _CapturingEngine
          from tests.services.test_run_service_aggregate_admission import _aggregate_check
          from tests.services._run_service_fixtures import (
              _all_key_safety_checks,_compiled_check_payload,row_count_plan,write_duckdb_key_safety_run_inputs,
          )
          
          def emit(**facts):
              print(json.dumps(facts,sort_keys=True),flush=True)
          
          def settings(c):
              return c.execute("select current_setting('memory_limit'),current_setting('threads'),current_setting('max_temp_directory_size'),current_setting('temp_directory')").fetchone()
          
          def invoke(root,mode):
              # Entire invocation is an ordinary Python CLI process. No per-check child,
              # no IPC for native query results, no OS ownership proof.
              engine=_CapturingEngine()
              opens=0
              closes=0
              with tempfile.TemporaryDirectory(prefix="recon-direct-probe-") as scratch:
                  def connect(database,*,read_only):
                      assert read_only
                      c=duckdb.connect(database,read_only=True,config={"memory_limit":"256MiB","threads":"1","temp_directory":scratch})
                      try:
                          c.execute("SET max_temp_directory_size='512MiB'")
                          values=settings(c)
                          assert values[1]==1 and values[3]==scratch
                          return c
                      except BaseException:
                          c.close()
                          raise
                  original_open=binding._OwnedDuckDbSession.open
                  original_close=binding._OwnedDuckDbSession.close
                  def opened(s):
                      nonlocal opens
                      original_open(s)
                      opens+=1
                  def closed(s):
                      nonlocal closes
                      result=original_close(s)
                      if s.released:
                          closes+=1
                      return result
                  binding.import_module=lambda name:SimpleNamespace(connect=connect)
                  binding._OwnedDuckDbSession.open=opened
                  binding._OwnedDuckDbSession.close=closed
                  cli.RunService=lambda:RunService(start_path=root,engine=engine)
                  result=cli.main(["run"],standalone_mode=False)
                  assert engine.result is not None
                  checks=[c for contract in engine.result.contract_results for c in contract.check_results]
                  statuses=[c.status.value for c in checks]
                  codes=sorted({d.code for c in checks for d in c.diagnostics})
                  if mode=="pass":
                      assert result in (None,0) and len(checks)==9 and statuses==["pass"]*9
                      assert opens==closes==9
                  else:
                      assert result not in (None,0) and not any(c.executed for c in checks)
                      assert opens==0
                  emit(case="invocation",mode=mode,statuses=statuses,opens=opens,closes=closes,codes=codes,exit=result)
              assert not Path(scratch).exists()
              emit(case="scratch_cleanup",removed=True)
          
          def supervise(root):
              db=root/"warehouse.duckdb"
              with duckdb.connect(str(db)) as c:
                  c.execute("create schema qa")
                  c.execute("create table qa.source_customers as select i::integer customer_id,1::integer month,5::bigint revenue from range(1000) t(i)")
                  c.execute("create table qa.target_customers as select * from qa.source_customers")
              checks=[_compiled_check_payload(operations=row_count_plan()),*_all_key_safety_checks(),_aggregate_check(tolerance=0),_aggregate_check(grouped=True,tolerance=0)]
              write_duckdb_key_safety_run_inputs(root,db,checks=checks)
              before=hashlib.sha256(db.read_bytes()).digest()
              def launch(mode):
                  # -m executes from repository checkout; root passed only synthetic.
                  r=subprocess.run([sys.executable,__file__,"invoke",str(root),mode],capture_output=True,text=True,timeout=60)
                  if r.returncode:
                      print(r.stdout,r.stderr,flush=True)
                  assert r.returncode==0
                  for line in r.stdout.splitlines():
                      if line.startswith("{"):print(line,flush=True)
              with duckdb.connect(str(db),read_only=True) as observer:
                  initial=settings(observer)
                  launch("pass")
                  assert settings(observer)==initial
                  assert observer.execute("select count(*) from qa.source_customers").fetchone()==(1000,)
                  emit(case="external_reader",unchanged=True,usable=True)
              with duckdb.connect(str(db)) as writer:
                  launch("refuse")
                  assert writer.execute("select count(*) from qa.source_customers").fetchone()==(1000,)
                  emit(case="external_writer",refused=True,usable=True)
              launch("pass")
              assert hashlib.sha256(db.read_bytes()).digest()==before
              assert not Path(str(db)+".tmp").exists()
              emit(case="after_release",database_unchanged=True,sidecar_absent=True)
          
          if sys.argv[1:] and sys.argv[1]=="invoke":
              invoke(Path(sys.argv[2]),sys.argv[3])
          else:
              with tempfile.TemporaryDirectory(prefix="recon-invocation-fixture-") as name:
                  supervise(Path(name).resolve())
              emit(case="experiment_cleanup",removed=not Path(name).exists())
          PY
          python temporary_direct_invocation.py
          rm temporary_direct_invocation.py
