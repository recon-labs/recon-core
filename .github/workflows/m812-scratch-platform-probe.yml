name: M8.1.2 temporary scratch platform probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m812-scratch-platform-probe.yml"
      - "src/recon_core/adapters/**"
      - "tests/adapters/test_resource_scratch.py"

permissions:
  contents: read

jobs:
  scratch:
    name: Scratch privacy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, windows-2022, windows-2025]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Record actual platform
        run: python -c "import platform, sys; print(platform.platform(), platform.machine(), sys.version)"
      - name: Exercise actual private directory lifecycle
        run: python -m pytest tests/adapters/test_resource_scratch.py -k check_scratch -vv -rs --tb=short
