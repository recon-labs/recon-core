name: Temporary branch-wide regression advisory
on:
  push:
    branches: [experiment/m812-exit-regression-advisory-20261127]
permissions:
  contents: read
jobs:
  advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - name: Exact feature branch review
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach dca839a0bdfed0dec57bb517250bb91a537af7bf
          git rev-parse HEAD
          git merge-base HEAD origin/main
          python scripts/check_regression_capture_decisions.py --base-ref origin/main --fail-on-findings
