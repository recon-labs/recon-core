name: Temporary named native instance embedded feasibility
on:
  push:
    branches: [experiment/m812-embedded-named-instance-20261127]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        duckdb: ['1.0.0','1.3.2','1.4.5','2.0.1']
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "duckdb==${{ matrix.duckdb }}"
      - name: Probe native read-only guard and native catalog naming
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import hashlib
          import uuid
          import json
          import tempfile
          from pathlib import Path
          import duckdb
          
          def emit(**facts):
              print(json.dumps(facts,sort_keys=True),flush=True)
          
          def settings(c):
              return c.execute("select current_setting('memory_limit'),current_setting('threads'),current_setting('max_temp_directory_size'),current_setting('temp_directory')").fetchone()
          
          def check(root,filename):
              path=root/filename
              with duckdb.connect(str(path)) as c:
                  c.execute("create table src as select 1::bigint as id")
                  native=c.execute("select current_database()").fetchone()[0]
              before=hashlib.sha256(path.read_bytes()).digest()
              # The ordinary read-only handle remains open for the full lifetime of the
              # independent instance. Native writer exclusion, not an OS proof or lock.
              with duckdb.connect(str(path),read_only=True) as observer:
                  original=settings(observer)
                  with duckdb.connect(str(path),read_only=True) as guard:
                      for mode in ("derived_alias",):
                          with tempfile.TemporaryDirectory(dir=root) as scratch:
                              with duckdb.connect(":memory:recon_"+uuid.uuid4().hex,config={"memory_limit":"256MiB","threads":"1","temp_directory":scratch}) as actor:
                                  literal=str(path).replace("'","''")
                                  emit(case="initial_catalog",filename=filename,name=actor.execute("select current_database()").fetchone()[0])
                                  alias=native.replace('"','""')
                                  try:
                                      sql=f"ATTACH '{literal}' (READ_ONLY)" if mode=="derived_alias" else f"ATTACH '{literal}' AS \"{alias}\" (READ_ONLY)"
                                      actor.execute(sql)
                                      rows=actor.execute("pragma database_list").fetchall()
                                      matches=[r[1] for r in rows if r[2] and Path(r[2]).resolve()==path.resolve()]
                                      assert len(matches)==1
                                      actual=matches[0]
                                      actor.execute('USE "'+actual.replace('"','""')+'"')
                                      actor.execute("SET max_temp_directory_size='512MiB'")
                                      value=actor.execute("select count(*) from src").fetchone()
                                      current=settings(actor)
                                      refused=False
                                      try:
                                          writer=duckdb.connect(str(path))
                                      except Exception:
                                          refused=True
                                      else:
                                          writer.close()
                                      read_only=False
                                      try:
                                          actor.execute("create table must_not_exist(i int)")
                                      except Exception as e:
                                          read_only="read-only" in str(e).lower() or "read only" in str(e).lower()
                                      emit(case="guarded_attach",filename=filename,mode=mode,native=native,actual=actual,alias_preserved=actual==native,read_ok=value==(1,),writer_refused=refused,readonly_write_refused=read_only,observer_unchanged=settings(observer)==original,guard_unchanged=settings(guard)==original,controls=current[1]==1 and current[3]==scratch)
                                  except Exception as e:
                                      emit(case="guarded_attach",filename=filename,mode=mode,accepted=False,native=native,error_type=type(e).__name__,error=str(e).replace(str(root),"<fixture>")[:300])
                  assert settings(observer)==original
              with duckdb.connect(str(path)) as writer:
                  # Existing writer must be refused by the original read-only guard.
                  try:
                      guard=duckdb.connect(str(path),read_only=True)
                  except Exception:
                      refused=True
                  else:
                      refused=False
                      guard.close()
                  emit(case="writer_first",filename=filename,guard_refused=refused,writer_usable=writer.execute("select count(*) from src").fetchone()==(1,))
              emit(case="released",filename=filename,unchanged=hashlib.sha256(path.read_bytes()).digest()==before)
          
          with tempfile.TemporaryDirectory(prefix="recon-guard-native-") as name:
              root=Path(name).resolve()
              for filename in ("ordinary.duckdb","odd.name.data","space quote ' ü.duckdb","memory.duckdb","temp.duckdb","system.duckdb"):
                  check(root,filename)
          emit(case="cleanup",removed=not Path(name).exists())
          PY
          python "$RUNNER_TEMP/probe.py"
