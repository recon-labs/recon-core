name: Temporary M8.1.2 Windows ACL proof
on:
  push:
    branches: [experiment/m812-windows-acl-20261126]
    paths: ['.github/workflows/temporary-m812-windows-acl.yml']
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -ra tests/adapters/test_windows_scratch_security.py
      - name: Verify deliberately weakened ACL check
        shell: pwsh
        run: |
          python -c "from pathlib import Path; p=Path('src/recon_core/adapters/_windows_scratch_security.py'); s=p.read_text(); old='or size.count != 1'; assert old in s; p.write_text(s.replace(old, 'or size.count < 1'))"
          pytest -q tests/adapters/test_windows_scratch_security.py::test_native_acl_broadening_is_rejected *> mutation.log
          $result = $LASTEXITCODE
          Get-Content mutation.log
          git restore src/recon_core/adapters/_windows_scratch_security.py
          if ($result -ne 1 -or -not (Select-String -Path mutation.log -Pattern 'DID NOT RAISE' -Quiet)) { exit 1 }
          Remove-Item mutation.log
          exit 0
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --diff src/recon_core/adapters/_windows_scratch_security.py tests/adapters/test_windows_scratch_security.py
        continue-on-error: true
      - run: ruff check src/recon_core/adapters/_windows_scratch_security.py tests/adapters/test_windows_scratch_security.py
        continue-on-error: true
      - run: mypy src
        continue-on-error: true
      - run: python scripts/check_regression_capture_decisions.py --base-ref b001d14de1fb613beaaad1f3e914f81dfb125cac
