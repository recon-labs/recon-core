name: Temporary Windows scratch lifecycle proof
on:
  push:
    branches:
      - experiment/m812-windows-lifecycle-20261126
permissions:
  contents: read
jobs:
  platform:
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 00e051df29c79a5465809442923ae6f7014b77dd
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,duckdb]"
      - run: python -m pytest -q -ra tests/adapters/test_windows_scratch_security.py tests/adapters/test_scratch_namespace.py tests/adapters/test_resource_scratch.py tests/adapters/test_scratch_filesystem.py
  negative:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3562fc5c909989beb2e57c08ed35332d3717c344
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Actual pre-integration regression failures
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/adapters/test_scratch_namespace.py -k 'windows_broadened' > red.log 2>&1
          status=$?
          set -e
          cat red.log
          test "$status" -eq 1
          grep -F "DID NOT RAISE" red.log
          grep -F "6 failed" red.log
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 00e051df29c79a5465809442923ae6f7014b77dd
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: python scripts/check_regression_capture.py
      - run: python scripts/check_regression_capture_decisions.py --base-ref b001d14de1fb613beaaad1f3e914f81dfb125cac
