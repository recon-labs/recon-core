name: Temporary bound grouped correction feasibility
on:
  push:
    branches: [experiment/m7-4-bound-join-prework-20261126]
    paths: ['scripts/temporary_m7_bound_join_probe.py', '.github/workflows/temporary-m7-bound-join-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        duckdb: ['1.0.0', '1.3.2', '1.4.5', '2.0.1']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependency
        env:
          PIN: ${{ matrix.duckdb }}
        run: |
          python -m pip install -e . "duckdb==$PIN"
          python -c 'import duckdb,os; assert duckdb.__version__ == os.environ["PIN"]; print(duckdb.__version__)'
      - name: Bounded native feasibility
        run: python -u scripts/temporary_m7_bound_join_probe.py
