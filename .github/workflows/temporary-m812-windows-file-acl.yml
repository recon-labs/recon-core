name: Temporary Windows scratch file ACL proof
on:
  push:
    branches:
      - experiment/m812-windows-file-acl-20261126
permissions:
  contents: read
jobs:
  platform:
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f97bdec229653a3ae2f217edd01aff33f771e7b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,duckdb]"
      - run: python -m pytest -q -ra tests/adapters/test_windows_scratch_security.py tests/adapters/test_scratch_namespace.py tests/adapters/test_resource_scratch.py tests/adapters/test_scratch_filesystem.py
  negative:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f97bdec229653a3ae2f217edd01aff33f771e7b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Baseline actual broadened file ACL rejection
        run: python -m pytest -q tests/adapters/test_windows_scratch_security.py::test_native_file_acl_broadening_is_rejected
      - name: Mutation must expose the missing file ACL proof
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/recon_core/adapters/_windows_scratch_security.py")
          s = p.read_text()
          old = "    _verify_private_object(path, directory=False)"
          assert s.count(old) == 1
          p.write_text(s.replace(old, "    return"))
          PY
          set +e
          python -m pytest -q tests/adapters/test_windows_scratch_security.py::test_native_file_acl_broadening_is_rejected > red.log 2>&1
          status=$?
          set -e
          git restore src/recon_core/adapters/_windows_scratch_security.py
          cat red.log
          test "$status" -eq 1
          grep -F "DID NOT RAISE" red.log
          grep -F "1 failed" red.log
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f97bdec229653a3ae2f217edd01aff33f771e7b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: python scripts/check_regression_capture.py
      - run: python scripts/check_regression_capture_decisions.py --base-ref b001d14de1fb613beaaad1f3e914f81dfb125cac
