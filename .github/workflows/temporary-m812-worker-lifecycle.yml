name: Temporary M8.1.2 worker lifecycle proof
on:
  push:
    branches: [experiment/m812-worker-lifecycle-20261126]
    paths: ['.github/workflows/temporary-m812-worker-lifecycle.yml']
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,duckdb]"
      - run: pytest -ra tests/adapters/test_duckdb_resource_worker.py
        env:
          RECON_REQUIRE_DUCKDB_TESTS: '1'
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,duckdb]"
      - run: ruff format --diff src/recon_core/adapters/duckdb/_resource_worker.py src/recon_core/adapters/duckdb/_worker_control_protocol.py tests/adapters/test_duckdb_resource_worker.py
        continue-on-error: true
      - run: ruff check src/recon_core/adapters/duckdb/_resource_worker.py src/recon_core/adapters/duckdb/_worker_control_protocol.py tests/adapters/test_duckdb_resource_worker.py
        continue-on-error: true
      - run: mypy src
        continue-on-error: true
      - run: python scripts/check_regression_capture_decisions.py --base-ref b001d14de1fb613beaaad1f3e914f81dfb125cac
      - name: Verify stop-request-only regression is detected
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("src/recon_core/adapters/duckdb/_resource_worker.py")
          s=p.read_text()
          old="result = _wait_for_exit(process, timeout)"
          assert old in s
          p.write_text(s.replace(old, "result = _WorkerStop(True, 0)", 1))
          PY
          set +e
          pytest -q tests/adapters/test_duckdb_resource_worker.py::test_stop_request_is_not_confirmed_exit > mutation.log 2>&1
          result=$?
          set -e
          cat mutation.log
          test "$result" -eq 1
          grep -q 'AssertionError' mutation.log
          git restore src/recon_core/adapters/duckdb/_resource_worker.py
          rm mutation.log
